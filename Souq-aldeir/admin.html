<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم المدير - سوق دير الزور</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="src/css/style.css">
</head>
<body>

<!-- NAV -->
<div class="topnav">
  <div class="logo-wrap">
    <div class="logo-icon">🛡️</div>
    <div class="logo-text">لوحة تحكم المدير<small>سوق دير الزور</small></div>
  </div>
  <div class="nav-btns">
    <a href="index.html" class="nav-btn" title="العودة للموقع"><i class="fa fa-home"></i></a>
  </div>
</div>

<div class="admin-page-wrap">

  <!-- تظهر هذه إذا لم يكن المستخدم مديراً -->
  <div class="admin-lock" id="lockedView" style="display:none">
    <i class="fa fa-lock"></i>
    <h3 style="margin-bottom:8px">هذه الصفحة للمدير فقط</h3>
    <p style="font-size:.9em;margin-bottom:16px">سجّل الدخول بحساب يملك صلاحية المدير للمتابعة</p>
    <button class="btn btn-blue" style="width:auto;padding:10px 24px" onclick="openM('authModal')"><i class="fa fa-sign-in-alt"></i> تسجيل الدخول</button>
  </div>

  <!-- محتوى لوحة التحكم -->
  <div id="adminPageBody" style="display:none;padding-top:14px"></div>

</div>

<!-- ======= MODAL: AUTH (لتسجيل الدخول من هذه الصفحة أيضاً) ======= -->
<div class="modal" id="authModal">
  <div class="sheet">
    <div class="handle"></div>
    <div class="sheet-head"><span class="sheet-title">تسجيل الدخول</span><button class="xbtn" onclick="closeM('authModal')">✕</button></div>
    <div class="errmsg" id="authErr"></div>
    <div class="sucmsg" id="authSuc"></div>
    <div id="pLogin">
      <div class="fg"><label>رقم الهاتف أو البريد الإلكتروني</label><input type="text" id="liEmail" placeholder="09xxxxxxxx أو example@mail.com"></div>
      <div class="fg"><label>كلمة المرور</label><input type="password" id="liPass" placeholder="••••••••"></div>
      <button class="btn btn-blue" id="liBtn" onclick="doLogin()"><i class="fa fa-sign-in-alt"></i> دخول</button>
    </div>
  </div>
</div>

<!-- ======= MODAL: AD DETAIL (يُستخدم عند حذف إعلان من اللوحة) ======= -->
<div class="modal" id="detailModal">
  <div class="sheet">
    <div class="handle"></div>
    <div class="sheet-head"><span class="sheet-title">تفاصيل الإعلان</span><button class="xbtn" onclick="closeM('detailModal')">✕</button></div>
    <div id="detailBody"></div>
  </div>
</div>

<div class="toast" id="toastEl"></div>

<!-- ===== SCRIPTS ===== -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="src/js/firebase.js"></script>
<script src="src/js/utils.js"></script>
<script src="src/components/toast.js"></script>
<script src="src/components/modal.js"></script>
<script src="src/js/auth.js"></script>
<script src="src/js/ads.js"></script>
<script src="src/js/admin.js"></script>

<script>
/* عند تغيّر حالة تسجيل الدخول، تحقق من صلاحية المدير وأظهر/أخفِ المحتوى */
async function onAuthReady(user) {
  const locked = document.getElementById('lockedView');
  const body = document.getElementById('adminPageBody');
  if (!user) {
    locked.style.display = 'flex';
    body.style.display = 'none';
    return;
  }
  // isAdmin يُحدَّث تلقائياً داخل auth.js قبل استدعاء هذا الـ hook
  if (!isAdmin) {
    locked.innerHTML = `
      <i class="fa fa-lock"></i>
      <h3 style="margin-bottom:8px">حسابك لا يملك صلاحية المدير</h3>
      <p style="font-size:.9em;margin-bottom:16px">اذهب لصفحة "حسابي" في الموقع الرئيسي واضغط "إعداد صلاحية المدير"</p>
      <a href="index.html" class="btn btn-outline" style="width:auto;padding:10px 24px;display:inline-flex"><i class="fa fa-home"></i> العودة للموقع</a>
    `;
    locked.style.display = 'flex';
    body.style.display = 'none';
    return;
  }
  locked.style.display = 'none';
  body.style.display = 'block';
  // نحتاج allAds لعرض لوحة التحكم - نحمّلها ثم نعرض اللوحة
  await loadAdsForAdmin();
  renderAdminBody('adminPageBody');
}

/* تحميل الإعلانات (بدون عرضها في شبكة، فقط لتعبئة allAds المستخدمة في admin.js) */
function loadAdsForAdmin() {
  return db.collection('ads').orderBy('createdAt', 'desc').get().then(snap => {
    allAds = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }).catch(() => { allAds = []; });
}

/* اجعل loadAds المستدعاة من admin.js/ads.js تُحدّث اللوحة بدل الشبكة الرئيسية */
async function loadAds() {
  await loadAdsForAdmin();
  if (isAdmin) renderAdminBody('adminPageBody');
}
</script>
</body>
</html>
