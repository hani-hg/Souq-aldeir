<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - سوق دير الزور</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="src/css/style.css">
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <div style="text-align:center;margin-bottom:20px">
      <div class="logo-icon" style="margin:0 auto 10px;width:56px;height:56px;font-size:1.8em">🛒</div>
      <h2 style="color:var(--dark);font-weight:800">سوق دير الزور</h2>
      <p style="color:var(--gray);font-size:.85em;margin-top:4px">أول سوق إلكتروني في دير الزور</p>
    </div>

    <div class="tab-bar">
      <button class="tab-btn on" id="t-login" onclick="switchTab('login')">دخول</button>
      <button class="tab-btn" id="t-signup" onclick="switchTab('signup')">حساب جديد</button>
      <button class="tab-btn" id="t-reset" onclick="switchTab('reset')">نسيت كلمة المرور</button>
    </div>

    <div class="errmsg" id="authErr"></div>
    <div class="sucmsg" id="authSuc"></div>

    <div id="pLogin">
      <div class="fg"><label>رقم الهاتف أو البريد الإلكتروني</label><input type="text" id="liEmail" placeholder="09xxxxxxxx أو example@mail.com"></div>
      <div class="fg"><label>كلمة المرور</label><input type="password" id="liPass" placeholder="••••••••"></div>
      <button class="btn btn-blue" id="liBtn" onclick="doLoginAndRedirect()"><i class="fa fa-sign-in-alt"></i> دخول</button>
    </div>

    <div id="pSignup" style="display:none">
      <div class="fg"><label>الاسم الكامل *</label><input type="text" id="suName" placeholder="اسمك الكامل"></div>
      <div class="fg"><label>رقم الهاتف * <small style="color:var(--red)">(إجباري)</small></label><input type="tel" id="suPhone" placeholder="09xxxxxxxx"></div>
      <div class="fg"><label>البريد الإلكتروني <small style="color:var(--gray)">(اختياري)</small></label><input type="email" id="suEmail" placeholder="example@mail.com"></div>
      <div class="fg"><label>كلمة المرور * (6 أحرف على الأقل)</label><input type="password" id="suPass" placeholder="••••••••"></div>
      <button class="btn btn-blue" id="suBtn" onclick="doSignupAndRedirect()"><i class="fa fa-user-plus"></i> إنشاء الحساب</button>
    </div>

    <div id="pReset" style="display:none">
      <div id="resetS1">
        <p style="font-size:.85em;color:var(--gray);margin-bottom:12px;line-height:1.6">أدخل رقم هاتفك المسجّل وسنرسل رمز التحقق عبر واتساب</p>
        <div class="fg"><label>رقم الهاتف المسجّل *</label><input type="tel" id="rsPhone" placeholder="09xxxxxxxx"></div>
        <button class="btn btn-outline" id="rsBtn1" onclick="sendOTP()"><i class="fa fa-mobile-alt"></i> إرسال رمز التحقق</button>
      </div>
      <div id="resetS2" style="display:none">
        <p style="font-size:.83em;color:var(--gray);margin-bottom:10px">أدخل الرمز الذي وصلك عبر واتساب وكلمة المرور الجديدة</p>
        <div class="fg"><label>رمز التحقق (6 أرقام)</label><input type="text" id="rsOTP" placeholder="123456" maxlength="6"></div>
        <div class="fg"><label>كلمة المرور الجديدة</label><input type="password" id="rsPass1" placeholder="••••••••"></div>
        <div class="fg"><label>تأكيد كلمة المرور</label><input type="password" id="rsPass2" placeholder="••••••••"></div>
        <button class="btn btn-blue" id="rsBtn2" onclick="verifyOTP()"><i class="fa fa-check"></i> تغيير كلمة المرور</button>
        <button class="btn btn-gray" style="margin-top:6px" onclick="document.getElementById('resetS1').style.display='block';document.getElementById('resetS2').style.display='none'">رجوع</button>
      </div>
    </div>

    <p style="text-align:center;margin-top:16px">
      <a href="index.html" style="color:var(--gray);font-size:.85em;text-decoration:none"><i class="fa fa-arrow-right"></i> العودة للموقع</a>
    </p>
  </div>
</div>

<div class="toast" id="toastEl"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="src/js/firebase.js"></script>
<script src="src/js/utils.js"></script>
<script src="src/components/toast.js"></script>
<script src="src/components/modal.js"></script>
<script src="src/js/auth.js"></script>

<script>
/* في صفحة الدخول المستقلة، بعد نجاح الدخول ننتقل للرئيسية */
async function doLoginAndRedirect() { await doLogin(); }
async function doSignupAndRedirect() { await doSignup(); }

auth.onAuthStateChanged(user => {
  if (user) window.location.href = 'index.html';
});
</script>
</body>
</html>
