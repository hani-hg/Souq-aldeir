<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>إعادة تعيين كلمة المرور | سوق دير الزور</title>
  <meta name="description" content="تعيين كلمة مرور جديدة لحسابك في سوق دير الزور المفتوح">
  <link rel="icon" type="image/png" href="/icons/icon-192.png?v=3">
  <link rel="stylesheet" href="/css/style.css?v=4">
  <style>
    body{min-height:100vh;background:linear-gradient(145deg,#eaf3ff,#fff);display:flex;align-items:center;justify-content:center;padding:20px 16px 40px}
    .reset-card{width:min(100%,460px);background:#fff;border-radius:22px;box-shadow:0 12px 40px rgba(21,101,192,.14);padding:28px 22px}
    .reset-logo{display:block;width:72px;height:72px;margin:0 auto 14px;border-radius:18px}
    .reset-card h1{text-align:center;font-size:1.35rem;margin:0 0 8px;color:var(--dark)}
    .reset-card .intro{text-align:center;color:var(--gray);font-size:.9rem;line-height:1.7;margin:0 0 22px}
    .reset-card .btn{margin-top:12px}
    .reset-card .back{text-align:center;display:block;margin-top:18px;color:var(--blue);font-weight:700;text-decoration:none;font-size:.88rem}
    #resetState{display:none}.state-icon{text-align:center;font-size:2.4rem;margin-bottom:10px}
  </style>
</head>
<body>
  <main class="reset-card">
    <img class="reset-logo" src="/icons/icon-192.png?v=3" alt="سوق دير الزور">
    <section id="resetFormState">
      <h1>إعادة تعيين كلمة المرور</h1>
      <p class="intro">اكتب كلمة مرور جديدة لحسابك. يجب أن تتكون من 8 أحرف على الأقل.</p>
      <div class="err" id="resetPageErr" role="alert"></div>
      <div class="fg">
        <label for="newPassword">كلمة المرور الجديدة</label>
        <div style="position:relative">
          <input type="password" id="newPassword" autocomplete="new-password" minlength="8" maxlength="128" placeholder="8 أحرف على الأقل" style="padding-left:40px">
          <button type="button" class="pw-toggle" onclick="toggleResetPassword('newPassword',this)" aria-label="إظهار كلمة المرور"><i class="fa fa-eye"></i></button>
        </div>
      </div>
      <div class="fg">
        <label for="confirmPassword">تأكيد كلمة المرور</label>
        <div style="position:relative">
          <input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" maxlength="128" placeholder="أعد كتابة كلمة المرور" style="padding-left:40px">
          <button type="button" class="pw-toggle" onclick="toggleResetPassword('confirmPassword',this)" aria-label="إظهار كلمة المرور"><i class="fa fa-eye"></i></button>
        </div>
      </div>
      <button class="btn btn-blue" id="resetSubmit" type="button" onclick="submitNewPassword()"><i class="fa fa-key"></i> حفظ كلمة المرور الجديدة</button>
    </section>
    <section id="resetState">
      <div class="state-icon">✓</div>
      <h1>تم تحديث كلمة المرور</h1>
      <p class="intro">يمكنك الآن تسجيل الدخول إلى حسابك باستخدام كلمة المرور الجديدة.</p>
      <a class="btn btn-blue" href="/">العودة إلى سوق دير الزور</a>
    </section>
    <a class="back" href="/">العودة إلى الموقع</a>
  </main>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/reset-password.js"></script>
</body>
</html>
