<!DOCTYPE html>

<html dir="rtl">

<body>

<div id="view"></div>

<script>

const id=
new URLSearchParams(
location.search
)
.get(
"id"
);

const ads=
JSON.parse(
localStorage.getItem(
"ads"
)
)||[];

const ad=
ads.find(
x=>
x.id==id
);

view.innerHTML=`

<h1>

${ad.title}

</h1>

<img
src=
${ad.image}
width=100%
>

<h2>

${ad.price}$

</h2>

<p>

📞
${ad.phone}

</p>

`;

</script>

</body>

</html>
