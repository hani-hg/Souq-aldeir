<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سوق دير الزور المفتوح - مع Cloudinary</title>
  <style>
    body { font-family: Arial; direction: rtl; background: #f4f4f4; padding: 10px; }
    input, textarea, button, select { width: 100%; margin: 5px 0; padding: 8px; box-sizing: border-box; }
    .ad { background: #fff; padding: 10px; margin: 10px 0; border-radius: 5px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
    .ad img { max-width: 100%; max-height: 200px; object-fit: cover; margin-top: 5px; border-radius: 5px; }
    .preview img { max-width: 100%; max-height: 150px; margin-top: 5px; border-radius: 5px; }
    #uploadCloudinaryBtn { background: #1abc9c; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; width: auto; margin-left: 10px; }
    .flex-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  </style>
</head>
<body>

<h2>🛒 سوق دير الزور المفتوح</h2>

<!-- قسم المصادقة -->
<div id="auth">
  <input id="email" placeholder="البريد الإلكتروني">
  <input id="password" type="password" placeholder="كلمة المرور">
  <div class="flex-row">
    <button onclick="login()">دخول</button>
    <button onclick="signup()">تسجيل</button>
  </div>
</div>

<div class="flex-row">
  <button onclick="logout()">تسجيل خروج</button>
</div>

<hr>

<!-- إضافة إعلان -->
<h3>➕ إضافة إعلان</h3>
<input id="title" placeholder="عنوان الإعلان">
<textarea id="desc" placeholder="الوصف"></textarea>
<input id="price" placeholder="السعر">
<input id="category" placeholder="الفئة (مثال: عقارات)">

<!-- قسم رفع الصورة باستخدام Cloudinary -->
<div class="flex-row">
  <button type="button" id="uploadCloudinaryBtn">☁️ اختر صورة عبر Cloudinary</button>
  <span id="uploadStatus"></span>
</div>

<!-- معاينة الصورة بعد الرفع -->
<div class="preview" id="preview"></div>

<!-- حقل مخفي لحفظ رابط الصورة -->
<input type="hidden" id="imageUrl" value="">

<button onclick="addAd()">نشر الإعلان</button>

<hr>

<!-- عرض الإعلانات -->
<h3>📢 الإعلانات</h3>
<div id="ads"></div>

<!-- استيراد مكتبات Firebase و Cloudinary -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://upload-widget.cloudinary.com/global/all.js"></script>

<script>
  // ========== إعدادات Firebase (استبدلها بمشروعك) ==========
  const firebaseConfig = {
    apiKey: "AIzaSyCTRpzhyBsf-h9rh2AO6OuIAy_kE7k7fpY",
    authDomain: "souq-aldeir-8b708.firebaseapp.com",
    projectId: "souq-aldeir-8b708",
    storageBucket: "souq-aldeir-8b708.firebasestorage.app", // لا نحتاجه لكن يمكن تركه
    messagingSenderId: "718751448398",
    appId: "1:718751448398:web:b588ab6753d1fc7aa1321f"
  };

  // تهيئة Firebase
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // ========== إعدادات Cloudinary ==========
  const CLOUD_NAME = 'c-3c72bffdb9faf709374589f66346c8'; // ضع Cloud Name الخاص بك
  const UPLOAD_PRESET = 'souq_ads'; // اسم upload preset الذي أنشأته

  // عناصر الصفحة
  const uploadBtn = document.getElementById('uploadCloudinaryBtn');
  const uploadStatus = document.getElementById('uploadStatus');
  const imageUrlInput = document.getElementById('imageUrl');
  const previewDiv = document.getElementById('preview');

  // متغير لحفظ رابط الصورة مؤقتاً
  let uploadedImageUrl = '';

  // إنشاء أداة رفع Cloudinary
  const cloudinaryWidget = cloudinary.createUploadWidget(
    {
      cloudName: CLOUD_NAME,
      uploadPreset: UPLOAD_PRESET,
      multiple: false,
      maxFileSize: 5000000, // 5 ميجابايت
      sources: ['local', 'camera'],
      language: 'ar',
      text: {
        ar: {
          or: 'أو',
          back: 'رجوع',
          advanced: 'خيارات متقدمة',
          close: 'إغلاق',
          upload: 'رفع',
          done: 'تم',
          addMore: 'إضافة المزيد',
          cancel: 'إلغاء'
        }
      }
    },
    (error, result) => {
      if (!error && result && result.event === 'success') {
        // تم الرفع بنجاح
        console.log('تم رفع الصورة:', result.info);
        uploadedImageUrl = result.info.secure_url;
        imageUrlInput.value = uploadedImageUrl;
        uploadStatus.textContent = '✅ تم رفع الصورة';
        // عرض المعاينة
        previewDiv.innerHTML = `<img src="${uploadedImageUrl}" alt="صورة الإعلان">`;
      } else if (result && result.event === 'close') {
        console.log('أغلقت النافذة بدون رفع');
      } else if (error) {
        console.error('خطأ في الرفع:', error);
        uploadStatus.textContent = '❌ فشل الرفع';
      }
    }
  );

  // فتح الأداة عند الضغط على الزر
  uploadBtn.addEventListener('click', () => {
    cloudinaryWidget.open();
  });

  // ========== دوال المصادقة ==========
  window.signup = () => {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    firebase.auth().createUserWithEmailAndPassword(email, password)
      .then(() => alert("✅ تم التسجيل بنجاح"))
      .catch(error => alert("❌ خطأ: " + error.message));
  };

  window.login = () => {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    firebase.auth().signInWithEmailAndPassword(email, password)
      .then(() => alert("✅ تم الدخول بنجاح"))
      .catch(error => alert("❌ خطأ: " + error.message));
  };

  window.logout = () => {
    firebase.auth().signOut()
      .then(() => alert("✅ تم تسجيل الخروج"));
  };

  // ========== دالة إضافة إعلان (باستخدام رابط Cloudinary) ==========
  window.addAd = async () => {
    const user = auth.currentUser;
    if (!user) {
      alert("⚠️ يجب تسجيل الدخول أولاً");
      return;
    }

    const title = document.getElementById("title").value.trim();
    const desc = document.getElementById("desc").value.trim();
    const price = document.getElementById("price").value.trim();
    const category = document.getElementById("category").value.trim();
    const imageUrl = imageUrlInput.value.trim(); // الرابط من الحقل المخفي

    if (!title || !desc || !price || !category) {
      alert("⚠️ يرجى ملء جميع الحقول");
      return;
    }

    if (!imageUrl) {
      alert("⚠️ يرجى رفع صورة للإعلان عبر Cloudinary");
      return;
    }

    // تعطيل زر النشر مؤقتاً
    const addBtn = document.querySelector('button[onclick="addAd()"]');
    addBtn.disabled = true;
    addBtn.textContent = "جاري النشر...";

    try {
      await db.collection("ads").add({
        title,
        description: desc,
        price,
        category,
        user: user.email,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        imageUrl: imageUrl
      });

      alert("✅ تم نشر الإعلان بنجاح");
      
      // تفريغ الحقول
      document.getElementById("title").value = "";
      document.getElementById("desc").value = "";
      document.getElementById("price").value = "";
      document.getElementById("category").value = "";
      document.getElementById("imageUrl").value = "";
      document.getElementById("uploadStatus").textContent = "";
      document.getElementById("preview").innerHTML = "";
      uploadedImageUrl = "";
    } catch (error) {
      alert("❌ خطأ في النشر: " + error.message);
    } finally {
      addBtn.disabled = false;
      addBtn.textContent = "نشر الإعلان";
    }
  };

  // ========== الاستماع للتغييرات في الإعلانات وعرضها ==========
  db.collection("ads").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
    const adsDiv = document.getElementById("ads");
    if (snapshot.empty) {
      adsDiv.innerHTML = "<p>لا توجد إعلانات بعد. كن أول من يضيف إعلاناً!</p>";
      return;
    }

    let html = "";
    snapshot.forEach((doc) => {
      const ad = doc.data();
      const imageHtml = ad.imageUrl 
        ? `<img src="${ad.imageUrl}" alt="صورة الإعلان">`
        : '';
      html += `
        <div class="ad">
          <b>${ad.title}</b><br>
          ${ad.description}<br>
          💰 السعر: ${ad.price}<br>
          📂 الفئة: ${ad.category}<br>
          👤 الناشر: ${ad.user}<br>
          ${imageHtml}
        </div>
      `;
    });
    adsDiv.innerHTML = html;
  });

  // ========== إخفاء/إظهار قسم المصادقة حسب حالة المستخدم ==========
  auth.onAuthStateChanged((user) => {
    const authDiv = document.getElementById("auth");
    authDiv.style.display = user ? "none" : "block";
  });
</script>

</body>
</html>
