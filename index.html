<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق دير الزور - منصة الإعلانات المبوبة</title>
    
    <!-- مكتبات Firebase (للمستقبل) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
    
    <style>
        /* أساسيات */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f8f9fa; color: #333; }
        
        /* الهيدر */
        .header {
            background: linear-gradient(135deg, #1a237e, #283593);
            color: white;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .logo { font-size: 2.5rem; font-weight: bold; margin-bottom: 10px; }
        
        /* شريط الحالة */
        .status-bar {
            background: white;
            padding: 15px;
            margin: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-dot {
            width: 12px; height: 12px; border-radius: 50%; display: inline-block;
        }
        .connected { background: #4CAF50; }
        .disconnected { background: #f44336; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        /* الفئات */
        .categories {
            max-width: 1200px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .category-card {
            background: #f8f9fa;
            padding: 25px 15px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .category-card:hover {
            background: white;
            border-color: #FF9800;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .category-icon { font-size: 2.8rem; margin-bottom: 15px; }
        
        /* الإعلانات */
        .ads {
            max-width: 1200px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }
        .ads-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 25px;
        }
        .ad-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.09);
            transition: all 0.3s;
            border: 1px solid #eee;
        }
        .ad-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }
        .ad-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        .ad-content { padding: 20px; }
        .ad-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; color: #1a237e; }
        .ad-price { color: #FF5722; font-size: 1.6rem; font-weight: bold; margin: 10px 0; }
        
        /* الأزرار */
        .btn {
            background: #FF9800;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
        }
        .btn:hover { background: #F57C00; transform: translateY(-2px); }
        
        /* مودال نشر إعلان */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
        }
        .modal-content {
            background: white;
            margin: 50px auto;
            width: 90%;
            max-width: 600px;
            border-radius: 15px;
            overflow: hidden;
        }
        .modal-header {
            background: #1a237e;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-body { padding: 25px; }
        
        /* الفوتر */
        footer {
            background: #1a237e;
            color: white;
            text-align: center;
            padding: 30px 20px;
            margin-top: 50px;
        }
        
        /* متجاوب */
        @media (max-width: 768px) {
            .categories-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            .ads-grid { grid-template-columns: 1fr; }
            .logo { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <!-- حالة الاتصال -->
    <div class="status-bar">
        <div>
            <span class="status-dot disconnected" id="statusDot"></span>
            <span id="statusText">🔌 وضع تجريبي - جاري الاتصال...</span>
        </div>
        <button class="btn" onclick="checkFirebase()">🔗 اختبار الاتصال</button>
    </div>
    
    <!-- الهيدر -->
    <div class="header">
        <div class="logo">🏪 سوق دير الزور</div>
        <p>منصة الإعلانات المبوبة الأولى في المنطقة</p>
        <div style="margin-top: 20px;">
            <button class="btn" onclick="openAdModal()">➕ نشر إعلان</button>
            <button class="btn" onclick="refreshData()">🔄 تحديث</button>
        </div>
    </div>
    
    <!-- الفئات -->
    <div class="categories">
        <h2 style="color: #1a237e; margin-bottom: 20px; text-align: center;">🔍 الفئات الرئيسية</h2>
        <div class="categories-grid" id="categoriesContainer">
            جاري تحميل الفئات...
        </div>
    </div>
    
    <!-- الإعلانات -->
    <div class="ads">
        <h2 style="color: #1a237e; margin-bottom: 20px; text-align: center;">📢 أحدث الإعلانات</h2>
        <div class="ads-grid" id="adsContainer">
            جاري تحميل الإعلانات...
        </div>
    </div>
    
    <!-- مودال نشر إعلان -->
    <div class="modal" id="adModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>نشر إعلان جديد</h2>
                <button onclick="closeModal()" style="background:none; border:none; color:white; font-size:1.5rem;">✕</button>
            </div>
            <div class="modal-body">
                <form id="adForm">
                    <input type="text" placeholder="عنوان الإعلان" id="title" required style="width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px;">
                    <textarea placeholder="وصف مفصل..." id="description" required style="width:100%; padding:12px; margin:10px 0; height:120px; border:1px solid #ddd; border-radius:8px;"></textarea>
                    <input type="number" placeholder="السعر ($)" id="price" required style="width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px;">
                    <select id="category" style="width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px;">
                        <option value="">اختر الفئة</option>
                    </select>
                    <input type="tel" placeholder="رقم التواصل" id="phone" required style="width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px;">
                    <button type="submit" class="btn" style="width:100%; padding:15px; font-size:1.1rem;">✅ نشر الإعلان</button>
                </form>
            </div>
        </div>
    </div>
    
    <!-- الفوتر -->
    <footer>
        <p>© 2024 سوق دير الزور. جميع الحقوق محفوظة.</p>
        <p style="margin-top: 10px; opacity: 0.9;">نسخة: منصة إعلانات مبوبة شاملة</p>
        <p style="margin-top: 5px;">souq-aldeir.vercel.app</p>
    </footer>

    <script>
        // ==================== البيانات الأساسية ====================
        const defaultData = {
            categories: [
                { id: "vehicles", name: "🚗 سيارات ومركبات", icon: "🚗", color: "#FF6B6B", count: 3 },
                { id: "realestate", name: "🏠 عقارات وشقق", icon: "🏠", color: "#4ECDC4", count: 2 },
                { id: "electronics", name: "💻 إلكترونيات", icon: "💻", color: "#45B7D1", count: 4 },
                { id: "phones", name: "📱 هواتف وأرقام", icon: "📱", color: "#96CEB4", count: 5 },
                { id: "jobs", name: "💼 وظائف وخدمات", icon: "💼", color: "#FFEAA7", count: 6 }
            ],
            ads: [
                {
                    id: 1,
                    title: "سيارة تويوتا كامري 2020 للبيع",
                    description: "سيارة بحالة ممتازة، موديل 2020، لون أبيض، كامل المواصفات، بدون حوادث، صيانة دورية في الوكالة.",
                    price: 18500,
                    category: "vehicles",
                    location: "دير الزور",
                    seller: "أحمد محمد",
                    phone: "0991234567",
                    date: "منذ 3 ساعات",
                    views: 124,
                    image: "https://images.unsplash.com/photo-1549399542-7e3f8b79c341?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80"
                },
                {
                    id: 2,
                    title: "شقة للايجار في حي الزهور",
                    description: "شقة طابق ثالث، 3 غرف نوم، صالة كبيرة، مطبخ مجهز، 2 حمام، تكييف مركزي، موقف سيارات.",
                    price: 350,
                    category: "realestate",
                    location: "الحسكة",
                    seller: "محمد علي",
                    phone: "0947654321",
                    date: "منذ يوم",
                    views: 89,
                    image: "https://images.unsplash.com/photo-1518780664697-55e3ad937233?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=60"
                }
            ],
            firebaseConnected: false
        };

        // ==================== تهيئة التطبيق ====================
        document.addEventListener('DOMContentLoaded', async function() {
            console.log("🚀 بدء تشغيل سوق دير الزور");
            
            // محاولة تهيئة Firebase
            await initializeFirebase();
            
            // تحميل البيانات
            await loadData();
            
            // إعداد الأحداث
            setupEvents();
        });

        // ==================== إدارة Firebase ====================
        async function initializeFirebase() {
            try {
                if (window.FirebaseApp && FirebaseApp.init()) {
                    console.log("✅ Firebase متاح");
                    updateStatus(true, "✅ متصل بقاعدة البيانات");
                    
                    // اختبار الاتصال
                    const test = await testFirebaseConnection();
                    if (test.connected) {
                        defaultData.firebaseConnected = true;
                    }
                } else {
                    console.log("⚠️ الوضع التجريبي - بدون قاعدة بيانات");
                    updateStatus(false, "🔌 وضع تجريبي - البيانات محلية");
                }
            } catch (error) {
                console.warn("❌ فشل تهيئة Firebase:", error);
                updateStatus(false, "🔌 وضع تجريبي - بدون اتصال");
            }
        }

        async function testFirebaseConnection() {
            try {
                if (!window.FirebaseApp) return { connected: false };
                
                const start = Date.now();
                const cats = await FirebaseApp.getCategories();
                const time = Date.now() - start;
                
                return {
                    connected: cats.success,
                    responseTime: time,
                    categories: cats.categories?.length || 0
                };
            } catch (error) {
                return { connected: false, error: error.message };
            }
        }

        // ==================== تحميل البيانات ====================
        async function loadData() {
            try {
                // محاولة جلب البيانات من Firebase أولاً
                if (defaultData.firebaseConnected && window.FirebaseApp) {
                    const [catsResult, adsResult] = await Promise.all([
                        FirebaseApp.getCategories(),
                        FirebaseApp.getAds()
                    ]);
                    
                    if (catsResult.success && catsResult.categories.length > 0) {
                        displayCategories(catsResult.categories);
                    } else {
                        displayCategories(defaultData.categories);
                    }
                    
                    if (adsResult.success && adsResult.ads.length > 0) {
                        displayAds(adsResult.ads);
                    } else {
                        displayAds(defaultData.ads);
                    }
                } else {
                    // استخدام البيانات المحلية
                    displayCategories(defaultData.categories);
                    displayAds(defaultData.ads);
                }
            } catch (error) {
                console.error("❌ خطأ في تحميل البيانات:", error);
                // استخدام البيانات الافتراضية في حالة الخطأ
                displayCategories(defaultData.categories);
                displayAds(defaultData.ads);
            }
        }

        // ==================== عرض الفئات ====================
        function displayCategories(categories) {
            const container = document.getElementById('categoriesContainer');
            const categorySelect = document.getElementById('category');
            
            container.innerHTML = '';
            categorySelect.innerHTML = '<option value="">اختر الفئة</option>';
            
            categories.forEach(cat => {
                // بطاقة الفئة
                const card = document.createElement('div');
                card.className = 'category-card';
                card.innerHTML = `
                    <div class="category-icon">${cat.icon}</div>
                    <div style="font-weight: bold; margin: 10px 0;">${cat.name}</div>
                    <div style="color: #666; font-size: 0.9rem;">${cat.count || 0} إعلان</div>
                `;
                card.onclick = () => filterByCategory(cat.id);
                container.appendChild(card);
                
                // خيار الفئة في النموذج
                const option = document.createElement('option');
                option.value = cat.id;
                option.textContent = cat.name;
                categorySelect.appendChild(option);
            });
        }

        // ==================== عرض الإعلانات ====================
        function displayAds(ads) {
            const container = document.getElementById('adsContainer');
            
            if (!ads || ads.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #666;">
                        <div style="font-size: 4rem; margin-bottom: 20px;">📭</div>
                        <h3>لا توجد إعلانات للعرض</h3>
                        <p>كن أول من ينشر إعلاناً!</p>
                        <button class="btn" onclick="openAdModal()" style="margin-top: 20px;">
                            ➕ نشر أول إعلان
                        </button>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '';
            
            ads.forEach(ad => {
                const category = defaultData.categories.find(c => c.id === ad.category) || 
                               { name: 'عام', color: '#999' };
                
                const card = document.createElement('div');
                card.className = 'ad-card';
                card.innerHTML = `
                    <img src="${ad.image || 'https://via.placeholder.com/500x300/3498db/ffffff?text=إعلان'}" 
                         class="ad-image" alt="${ad.title}">
                    <div class="ad-content">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                            <span style="background: ${category.color}20; color: ${category.color}; 
                                  padding: 5px 12px; border-radius: 15px; font-size: 0.85rem;">
                                ${category.name}
                            </span>
                            <span style="color: #888; font-size: 0.85rem;">${ad.date || ''}</span>
                        </div>
                        <h3 class="ad-title">${ad.title}</h3>
                        <p style="color: #555; margin-bottom: 15px; line-height: 1.5; height: 60px; overflow: hidden;">
                            ${ad.description}
                        </p>
                        <div class="ad-price">$${ad.price.toLocaleString()}</div>
                        <div style="display: flex; justify-content: space-between; color: #666; margin-top: 15px; font-size: 0.9rem;">
                            <span>📍 ${ad.location || 'دير الزور'}</span>
                            <span>👁️ ${ad.views || 0}</span>
                        </div>
                        <button class="btn" onclick="viewAd(${ad.id})" style="width: 100%; margin-top: 15px;">
                            📞 عرض التفاصيل
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // ==================== دوال التحكم ====================
        function openAdModal() {
            document.getElementById('adModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('adModal').style.display = 'none';
            document.body.style.overflow = 'auto';
            document.getElementById('adForm').reset();
        }

        async function submitAd(event) {
            event.preventDefault();
            
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const price = document.getElementById('price').value;
            const category = document.getElementById('category').value;
            const phone = document.getElementById('phone').value;
            
            if (!title || !description || !price || !category || !phone) {
                alert('❌ الرجاء ملء جميع الحقول');
                return;
            }
            
            // إنشاء إعلان جديد
            const newAd = {
                id: defaultData.ads.length + 1,
                title,
                description,
                price: Number(price),
                category,
                location: 'دير الزور',
                seller: 'مستخدم جديد',
                phone,
                date: 'الآن',
                views: 0,
                image: `https://via.placeholder.com/500x300/3498db/ffffff?text=${encodeURIComponent(title.substring(0, 15))}`
            };
            
            // إضافة إلى القائمة
            defaultData.ads.unshift(newAd);
            
            // تحديث عداد الفئة
            const cat = defaultData.categories.find(c => c.id === category);
            if (cat) cat.count++;
            
            // إغلاق النافذة وتحديث العرض
            closeModal();
            displayAds(defaultData.ads);
            displayCategories(defaultData.categories);
            
            alert(`✅ تم نشر إعلانك "${title}" بنجاح!`);
        }

        function filterByCategory(categoryId) {
            const filtered = categoryId ? 
                defaultData.ads.filter(ad => ad.category === categoryId) : 
                defaultData.ads;
            displayAds(filtered);
        }

        function viewAd(id) {
            const ad = defaultData.ads.find(a => a.id === id);
            if (!ad) return;
            
            const details = `
                🏷️ **${ad.title}**
                
                📝 ${ad.description}
                
                💰 **السعر:** $${ad.price}
                
                📍 **الموقع:** ${ad.location}
                
                👤 **البائع:** ${ad.seller}
                
                📞 **الاتصال:** ${ad.phone}
                
                📅 ${ad.date}
                
                👁️ ${ad.views} مشاهدة
            `;
            
            alert(details);
        }

        function refreshData() {
            loadData();
            alert('✅ تم تحديث البيانات');
        }

        async function checkFirebase() {
            const result = await testFirebaseConnection();
            if (result.connected) {
                alert(`✅ متصل بقاعدة البيانات\n\n- ${result.categories} فئة\n- الوقت: ${result.responseTime}ms`);
                updateStatus(true, "✅ متصل بقاعدة البيانات");
                defaultData.firebaseConnected = true;
                loadData(); // إعادة تحميل البيانات من Firebase
            } else {
                alert('❌ غير متصل بقاعدة البيانات\n\nالموقع يعمل في الوضع التجريبي');
                updateStatus(false, "🔌 وضع تجريبي");
            }
        }

        function updateStatus(connected, message) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            
            dot.className = connected ? 'status-dot connected' : 'status-dot disconnected';
            text.textContent = message;
        }

        function setupEvents() {
            // إغلاق المودال بالنقر خارجها
            window.onclick = function(event) {
                const modal = document.getElementById('adModal');
                if (event.target === modal) closeModal();
            };
            
            // إرسال النموذج
            document.getElementById('adForm').onsubmit = submitAd;
        }
    </script>
</body>
</html>
