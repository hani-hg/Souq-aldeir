<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سوق دير الزور للمستعمل</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background: linear-gradient(145deg, #f0f4f8 0%, #e6ecf5 100%);
      direction: rtl;
    }

    /* الشريط العلوي */
    .top-bar {
      background: linear-gradient(145deg, #2c3e50, #1e2b3a);
      color: white;
      padding: 15px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .logo {
      font-size: 26px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo i {
      color: #f1c40f;
      font-size: 32px;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 12px 20px;
      border: none;
      border-radius: 40px;
      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 16px;
      transition: 0.3s;
    }

    .search-box input::placeholder {
      color: rgba(255,255,255,0.7);
    }

    .search-box input:focus {
      background: rgba(255,255,255,0.3);
      outline: none;
    }

    .search-box i {
      position: absolute;
      left: 15px;
      top: 14px;
      color: rgba(255,255,255,0.8);
    }

    .icons {
      display: flex;
      gap: 20px;
    }

    .icons i {
      font-size: 24px;
      cursor: pointer;
      transition: 0.3s;
    }

    .icons i:hover {
      color: #f1c40f;
    }

    /* الحاوية الرئيسية */
    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 20px;
    }

    /* قسم المعلنين المميزين (بدلاً من الإحصائيات) */
    .featured-advertisers {
      background: white;
      border-radius: 30px;
      padding: 25px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .featured-title {
      font-size: 22px;
      font-weight: 700;
      color: #2c3e50;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .featured-title i {
      color: #f1c40f;
    }

    .advertisers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
    }

    .advertiser-card {
      background: linear-gradient(145deg, #f8fafc, #eef2f6);
      border-radius: 20px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
      transition: 0.3s;
      cursor: pointer;
    }

    .advertiser-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
    }

    .advertiser-card img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 10px;
      border: 3px solid #3498db;
    }

    .advertiser-card h4 {
      color: #2c3e50;
      margin-bottom: 5px;
    }

    .advertiser-card p {
      color: #7f8c8d;
      font-size: 14px;
    }

    /* قائمة الأقسام */
    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 30px;
      background: white;
      padding: 15px;
      border-radius: 60px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }

    .category-item {
      padding: 10px 25px;
      border-radius: 40px;
      background: #f0f4f8;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .category-item:hover,
    .category-item.active {
      background: #3498db;
      color: white;
    }

    /* بطاقات الإعلانات */
    .ads-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 80px;
    }

    .ad-card {
      background: white;
      border-radius: 25px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      transition: 0.3s;
      position: relative;
      cursor: pointer;
    }

    .ad-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
    }

    .ad-image {
      height: 180px;
      background: #ecf0f1;
    }

    .ad-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ad-content {
      padding: 15px;
    }

    .ad-title {
      font-weight: 700;
      font-size: 16px;
      color: #2c3e50;
      margin-bottom: 8px;
    }

    .ad-price {
      color: #27ae60;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .ad-meta {
      display: flex;
      justify-content: space-between;
      color: #7f8c8d;
      font-size: 13px;
    }

    .ad-actions {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      gap: 5px;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 10;
    }

    .ad-card:hover .ad-actions {
      opacity: 1;
    }

    .action-btn {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.6);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .action-btn.edit { background: #3498db; }
    .action-btn.delete { background: #e74c3c; }

    /* نموذج */
    .form-container {
      background: white;
      padding: 30px;
      border-radius: 40px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
      max-width: 550px;
      margin: 0 auto 80px;
    }

    .form-container h2 {
      margin-bottom: 25px;
      color: #2c3e50;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #2c3e50;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px 18px;
      border: 2px solid #e0e7ef;
      border-radius: 20px;
      font-size: 16px;
      transition: 0.3s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #3498db;
      outline: none;
    }

    .btn {
      background: #3498db;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 40px;
      width: 100%;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #2980b9;
    }

    .btn-small {
      background: #27ae60;
      padding: 10px;
      font-size: 16px;
    }

    /* الشريط السفلي */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-top: 2px solid #e0e7ef;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
      z-index: 100;
    }

    .nav-item {
      text-align: center;
      color: #7f8c8d;
      cursor: pointer;
      transition: 0.3s;
      font-size: 12px;
    }

    .nav-item i {
      font-size: 22px;
      display: block;
      margin-bottom: 5px;
    }

    .nav-item.active {
      color: #3498db;
      font-weight: 700;
    }

    /* الصفحات */
    .page { display: none; }
    .page.active-page { display: block; }

    /* ملف المستخدم */
    .user-menu {
      background: white;
      border-radius: 30px;
      overflow: hidden;
    }

    .user-menu-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 18px 20px;
      border-bottom: 1px solid #f0f4f8;
      cursor: pointer;
      transition: 0.3s;
      color: #2c3e50;
    }

    .user-menu-item:hover {
      background: #f0f4f8;
    }

    /* تفاصيل الإعلان */
    .ad-detail {
      background: white;
      padding: 20px;
      border-radius: 30px;
      margin-bottom: 80px;
    }

    .ad-detail img {
      max-width: 100%;
      max-height: 400px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .ad-detail h2 { color: #2c3e50; }
    .ad-detail .price { font-size: 24px; color: #27ae60; }
    .contact-info { display: flex; gap: 10px; margin: 15px 0; }
    .contact-info a { padding: 10px 20px; border-radius: 40px; text-decoration: none; color: white; }
    .contact-info a.whatsapp { background: #25D366; }
    .contact-info a.phone { background: #3498db; }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="logo"><i class="fas fa-store-alt"></i><span>سوق دير الزور للمستعمل</span></div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ابحث عن إعلان...">
      <i class="fas fa-search"></i>
    </div>
    <div class="icons">
      <i class="far fa-bell" id="notificationIcon" title="الإشعارات"></i>
      <i class="far fa-user-circle" id="userIcon" title="حسابي"></i>
    </div>
  </div>

  <!-- الصفحات -->
  <div class="container">
    <!-- الصفحة الرئيسية -->
    <div id="homePage" class="page active-page">
      <!-- قسم المعلنين المميزين (بدلاً من الإحصائيات) -->
      <div class="featured-advertisers">
        <div class="featured-title"><i class="fas fa-star"></i> معلنون مميزون</div>
        <div class="advertisers-grid" id="featuredGrid">
          <!-- سيتم تعبئتها لاحقاً -->
        </div>
      </div>

      <div class="categories" id="categoryList"></div>
      <h2 style="margin-bottom: 20px;">أحدث الإعلانات في دير الزور</h2>
      <div class="ads-grid" id="adsGrid"></div>
    </div>

    <!-- صفحة تسجيل الدخول/التسجيل -->
    <div id="registerPage" class="page">
      <div class="form-container">
        <h2 id="authTitle"><i class="fas fa-sign-in-alt"></i> تسجيل الدخول</h2>
        <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="authEmail" placeholder="example@domain.com"></div>
        <div class="form-group"><label>كلمة المرور</label><input type="password" id="authPassword" placeholder="********"></div>
        <div class="form-group" id="nameField" style="display:none;"><label>الاسم الكامل</label><input type="text" id="authName"></div>
        <div class="form-group" id="phoneField" style="display:none;"><label>رقم الهاتف</label><input type="text" id="authPhone" placeholder="+9639xxxxxxxx"></div>
        <div class="form-group" id="whatsappField" style="display:none;"><label>رابط واتساب (اختياري)</label><input type="text" id="authWhatsapp" placeholder="https://wa.me/..."></div>
        <button class="btn" id="authActionBtn">دخول</button>
        <p class="terms" id="toggleAuthMode">ليس لديك حساب؟ <a href="#" id="switchToSignup">إنشاء حساب</a></p>
      </div>
    </div>

    <!-- صفحة إضافة إعلان -->
    <div id="addAdPage" class="page">
      <div class="form-container">
        <h2><i class="fas fa-plus-circle"></i> إضافة إعلان</h2>
        <div class="form-group"><label>القسم</label><select id="adCategory"><option>عقارات</option><option>سيارات</option><option>جوالات</option><option>أثاث</option><option>ملابس</option><option>إلكترونيات</option></select></div>
        <div class="form-group"><label>المدينة</label><select id="adCity"><option>دير الزور (المركز)</option><option>الميادين</option><option>البوكمال</option><option>موحسن</option><option>التبني</option><option>القورية</option><option>خشام</option><option>مراط</option><option>صبيخان</option><option>عشارة</option><option>أخرى</option></select></div>
        <div class="form-group"><label>السعر (ل.س)</label><input type="text" id="adPrice" placeholder="50000"></div>
        <div class="form-group"><label>عنوان الإعلان</label><input type="text" id="adTitle"></div>
        <div class="form-group"><label>تفاصيل</label><textarea id="adDesc" rows="3"></textarea></div>
        <div class="form-group"><label>صورة</label><button class="btn btn-small" id="uploadCloudinaryBtn">☁️ رفع صورة</button><span id="uploadStatus"></span><div class="preview" id="preview"></div><input type="hidden" id="imageUrl"></div>
        <button class="btn" id="addAdBtn">نشر الإعلان</button>
      </div>
    </div>

    <!-- صفحة تعديل إعلان -->
    <div id="editAdPage" class="page">...</div> <!-- سيتم إضافتها لاحقاً بالكامل -->

    <!-- صفحة تفاصيل الإعلان -->
    <div id="detailPage" class="page">
      <div class="ad-detail" id="adDetailContainer"></div>
      <button class="btn" id="backFromDetailBtn" style="width:auto; margin-bottom:80px;">⬅ العودة</button>
    </div>

    <!-- صفحة الحساب (قائمة) -->
    <div id="accountPage" class="page">
      <div class="user-menu">
        <div class="user-menu-item" id="myProfileBtn"><i class="fas fa-user"></i> ملفي الشخصي</div>
        <div class="user-menu-item" id="myAdsBtn"><i class="fas fa-list"></i> إعلاناتي</div>
        <div class="user-menu-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> تسجيل خروج</div>
      </div>
    </div>

    <!-- صفحة ملفي الشخصي -->
    <div id="profilePage" class="page">
      <div class="form-container">
        <h2>ملفي الشخصي</h2>
        <div class="form-group"><label>الاسم</label><input type="text" id="profileName" readonly></div>
        <div class="form-group"><label>البريد</label><input type="email" id="profileEmail" readonly></div>
        <div class="form-group"><label>الهاتف</label><input type="text" id="profilePhone" readonly></div>
        <div class="form-group"><label>واتساب</label><input type="text" id="profileWhatsapp" readonly></div>
        <button class="btn" id="backFromProfileBtn">رجوع</button>
      </div>
    </div>

    <!-- صفحة إعلاناتي -->
    <div id="myAdsPage" class="page">
      <h2>إعلاناتي</h2>
      <div class="ads-grid" id="myAdsGrid"></div>
      <button class="btn" id="backFromMyAdsBtn">رجوع</button>
    </div>
  </div>

  <!-- الشريط السفلي -->
  <div class="bottom-nav">
    <div class="nav-item active" data-page="homePage"><i class="fas fa-home"></i> الرئيسية</div>
    <div class="nav-item" data-page="addAdPage"><i class="fas fa-plus-circle"></i> إضافة</div>
    <div class="nav-item" id="accountNavItem" data-page="accountPage"><i class="fas fa-user"></i> حسابي</div>
    <div class="nav-item" id="registerNavItem" data-page="registerPage"><i class="fas fa-sign-in-alt"></i> تسجيل</div>
  </div>

  <!-- Firebase و Cloudinary -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://upload-widget.cloudinary.com/global/all.js"></script>

  <script>
    // إعدادات Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCTRpzhyBsf-h9rh2AO6OuIAy_kE7k7fpY",
      authDomain: "souq-aldeir-8b708.firebaseapp.com",
      projectId: "souq-aldeir-8b708",
      storageBucket: "souq-aldeir-8b708.firebasestorage.app",
      messagingSenderId: "718751448398",
      appId: "1:718751448398:web:b588ab6753d1fc7aa1321f"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const CLOUD_NAME = 'dzjy5tubx';
    const UPLOAD_PRESET = 'souq-aldeir-prseset';

    // عناصر الصفحة
    const pages = document.querySelectorAll('.page');
    const navItems = document.querySelectorAll('.nav-item');
    const homePage = document.getElementById('homePage');
    const adsGrid = document.getElementById('adsGrid');
    const categoryList = document.getElementById('categoryList');
    const authEmail = document.getElementById('authEmail');
    const authPassword = document.getElementById('authPassword');
    const authName = document.getElementById('authName');
    const authPhone = document.getElementById('authPhone');
    const authWhatsapp = document.getElementById('authWhatsapp');
    const nameField = document.getElementById('nameField');
    const phoneField = document.getElementById('phoneField');
    const whatsappField = document.getElementById('whatsappField');
    const authActionBtn = document.getElementById('authActionBtn');
    const toggleAuthMode = document.getElementById('toggleAuthMode');
    const switchToSignup = document.getElementById('switchToSignup');
    const uploadBtn = document.getElementById('uploadCloudinaryBtn');
    const uploadStatus = document.getElementById('uploadStatus');
    const preview = document.getElementById('preview');
    const imageUrlInput = document.getElementById('imageUrl');
    const addAdBtn = document.getElementById('addAdBtn');
    const notificationIcon = document.getElementById('notificationIcon');
    const userIcon = document.getElementById('userIcon');
    const accountNavItem = document.getElementById('accountNavItem');
    const registerNavItem = document.getElementById('registerNavItem');
    const myProfileBtn = document.getElementById('myProfileBtn');
    const myAdsBtn = document.getElementById('myAdsBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const profilePage = document.getElementById('profilePage');
    const myAdsPage = document.getElementById('myAdsPage');
    const backFromProfileBtn = document.getElementById('backFromProfileBtn');
    const backFromMyAdsBtn = document.getElementById('backFromMyAdsBtn');
    const detailPage = document.getElementById('detailPage');
    const adDetailContainer = document.getElementById('adDetailContainer');
    const backFromDetailBtn = document.getElementById('backFromDetailBtn');
    const featuredGrid = document.getElementById('featuredGrid');

    let currentUser = null;
    let isLoginMode = true;
    let uploadedImageUrl = '';

    // بيانات وهمية للمعلنين المميزين (يمكن استبدالها ببيانات من Firestore لاحقاً)
    const dummyAdvertisers = [
      { name: 'معرض العصر', image: 'https://via.placeholder.com/150?text=معرض', specialty: 'سيارات' },
      { name: 'مكتب العقارات', image: 'https://via.placeholder.com/150?text=عقارات', specialty: 'عقارات' },
      { name: 'متجر الإلكترونيات', image: 'https://via.placeholder.com/150?text=الكترونيات', specialty: 'إلكترونيات' },
      { name: 'الأثاث العصري', image: 'https://via.placeholder.com/150?text=أثاث', specialty: 'أثاث' },
    ];

    function loadFeaturedAdvertisers() {
      let html = '';
      dummyAdvertisers.forEach(adv => {
        html += `
          <div class="advertiser-card">
            <img src="${adv.image}" alt="${adv.name}">
            <h4>${adv.name}</h4>
            <p>${adv.specialty}</p>
          </div>
        `;
      });
      featuredGrid.innerHTML = html;
    }

    // التنقل بين الصفحات
    navItems.forEach(item => {
      item.addEventListener('click', () => {
        const pageId = item.dataset.page;
        if (!pageId) return;
        pages.forEach(p => p.classList.remove('active-page'));
        document.getElementById(pageId).classList.add('active-page');
        navItems.forEach(n => n.classList.remove('active'));
        item.classList.add('active');
      });
    });

    // أيقونة الإشعارات
    notificationIcon.addEventListener('click', () => {
      alert('لا توجد إشعارات جديدة');
    });

    // أيقونة المستخدم تفتح صفحة الحساب أو التسجيل حسب حالة الدخول
    userIcon.addEventListener('click', () => {
      if (currentUser) {
        document.querySelector('.nav-item[data-page="accountPage"]').click();
      } else {
        document.querySelector('.nav-item[data-page="registerPage"]').click();
      }
    });

    // التبديل بين تسجيل الدخول والتسجيل
    switchToSignup.addEventListener('click', (e) => {
      e.preventDefault();
      isLoginMode = !isLoginMode;
      if (isLoginMode) {
        document.getElementById('authTitle').innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
        authActionBtn.textContent = 'دخول';
        nameField.style.display = 'none';
        phoneField.style.display = 'none';
        whatsappField.style.display = 'none';
        toggleAuthMode.innerHTML = 'ليس لديك حساب؟ <a href="#" id="switchToSignup">إنشاء حساب</a>';
      } else {
        document.getElementById('authTitle').innerHTML = '<i class="fas fa-user-plus"></i> إنشاء حساب';
        authActionBtn.textContent = 'تسجيل';
        nameField.style.display = 'block';
        phoneField.style.display = 'block';
        whatsappField.style.display = 'block';
        toggleAuthMode.innerHTML = 'لديك حساب؟ <a href="#" id="switchToSignup">تسجيل الدخول</a>';
      }
      document.getElementById('switchToSignup').addEventListener('click', switchToSignup);
    });

    // مصادقة Firebase
    authActionBtn.addEventListener('click', async () => {
      const email = authEmail.value.trim();
      const password = authPassword.value.trim();
      if (!email || !password) return alert('أدخل البريد وكلمة المرور');
      try {
        if (isLoginMode) {
          await auth.signInWithEmailAndPassword(email, password);
          alert('تم الدخول');
        } else {
          const name = authName.value.trim();
          const phone = authPhone.value.trim();
          if (!name || !phone) return alert('أدخل الاسم والهاتف');
          const userCredential = await auth.createUserWithEmailAndPassword(email, password);
          await db.collection('users').doc(userCredential.user.uid).set({
            name, phone, whatsapp: authWhatsapp.value.trim(), email
          });
          alert('تم التسجيل');
        }
        // إخفاء صفحة التسجيل والعودة للرئيسية
        document.querySelector('.nav-item[data-page="homePage"]').click();
      } catch (error) {
        alert('خطأ: ' + error.message);
      }
    });

    // مراقبة حالة المستخدم
    auth.onAuthStateChanged(user => {
      currentUser = user;
      if (user) {
        accountNavItem.style.display = 'block';
        registerNavItem.style.display = 'none';
      } else {
        accountNavItem.style.display = 'none';
        registerNavItem.style.display = 'block';
      }
      loadAds(); // إعادة تحميل الإعلانات لتحديث أزرار التعديل/الحذف
    });

    // Cloudinary Widget
    if (uploadBtn) {
      const widget = cloudinary.createUploadWidget(
        { cloudName: CLOUD_NAME, uploadPreset: UPLOAD_PRESET, multiple: false, maxFileSize: 5000000, sources: ['local', 'camera'], language: 'ar' },
        (error, result) => {
          if (!error && result && result.event === 'success') {
            uploadedImageUrl = result.info.secure_url;
            imageUrlInput.value = uploadedImageUrl;
            uploadStatus.innerHTML = '<i class="fas fa-check-circle" style="color:green;"></i> تم رفع الصورة';
            preview.innerHTML = `<img src="${uploadedImageUrl}" alt="صورة">`;
          } else if (error) {
            uploadStatus.innerHTML = '<i class="fas fa-times-circle" style="color:red;"></i> فشل الرفع';
          }
        }
      );
      uploadBtn.addEventListener('click', () => widget.open());
    }

    // إضافة إعلان
    addAdBtn.addEventListener('click', async () => {
      if (!currentUser) return alert('يجب تسجيل الدخول');
      const title = document.getElementById('adTitle').value.trim();
      const desc = document.getElementById('adDesc').value.trim();
      const price = document.getElementById('adPrice').value.trim();
      const category = document.getElementById('adCategory').value;
      const city = document.getElementById('adCity').value;
      const imageUrl = imageUrlInput.value.trim();
      if (!title || !desc || !price || !category || !city || !imageUrl) {
        return alert('املأ جميع الحقول وارفع صورة');
      }
      const userDoc = await db.collection('users').doc(currentUser.uid).get();
      const userData = userDoc.data() || {};
      addAdBtn.disabled = true;
      addAdBtn.textContent = 'جاري النشر...';
      try {
        await db.collection('ads').add({
          title, description: desc, price, category, city, imageUrl,
          userId: currentUser.uid,
          userName: userData.name || '',
          userPhone: userData.phone || '',
          userWhatsapp: userData.whatsapp || '',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert('تم النشر');
        // تفريغ الحقول
        document.getElementById('adTitle').value = '';
        document.getElementById('adDesc').value = '';
        document.getElementById('adPrice').value = '';
        imageUrlInput.value = '';
        uploadStatus.innerHTML = '';
        preview.innerHTML = '';
        uploadedImageUrl = '';
        document.querySelector('.nav-item[data-page="homePage"]').click();
      } catch (error) {
        alert('خطأ: ' + error.message);
      } finally {
        addAdBtn.disabled = false;
        addAdBtn.textContent = 'نشر الإعلان';
      }
    });

    // حذف الإعلان
    window.deleteAd = async (adId) => {
      if (!currentUser) return alert('يجب تسجيل الدخول');
      if (!confirm('متأكد؟')) return;
      try {
        await db.collection('ads').doc(adId).delete();
        alert('تم الحذف');
      } catch (error) {
        alert('خطأ: ' + error.message);
      }
    };

    // فتح التعديل (مبسط)
    window.editAd = (adId) => {
      alert('وظيفة التعديل قيد التطوير');
    };

    // عرض تفاصيل الإعلان
    window.showAdDetail = async (adId) => {
      try {
        const doc = await db.collection('ads').doc(adId).get();
        if (!doc.exists) return;
        const ad = doc.data();
        const date = ad.createdAt ? new Date(ad.createdAt.toDate()).toLocaleDateString('ar-EG') : '';
        const phoneLink = ad.userPhone ? `<a href="tel:${ad.userPhone}" class="phone"><i class="fas fa-phone"></i> اتصل</a>` : '';
        const whatsappLink = ad.userWhatsapp ? `<a href="${ad.userWhatsapp}" class="whatsapp" target="_blank"><i class="fab fa-whatsapp"></i> واتساب</a>` : '';
        adDetailContainer.innerHTML = `
          <img src="${ad.imageUrl}" alt="${ad.title}">
          <h2>${ad.title}</h2>
          <div class="price">💰 ${ad.price} ل.س</div>
          <div>📍 ${ad.city} | 📂 ${ad.category} | 📅 ${date}</div>
          <p>${ad.description}</p>
          <div class="contact-info">
            ${phoneLink} ${whatsappLink}
          </div>
          <p><i class="fas fa-user"></i> ${ad.userName || 'غير معروف'}</p>
        `;
        pages.forEach(p => p.classList.remove('active-page'));
        detailPage.classList.add('active-page');
      } catch (error) {
        alert('خطأ في التحميل');
      }
    };

    backFromDetailBtn.addEventListener('click', () => {
      document.querySelector('.nav-item[data-page="homePage"]').click();
    });

    // تحميل الإعلانات
    async function loadAds() {
      try {
        const snapshot = await db.collection('ads').orderBy('createdAt', 'desc').get();
        if (snapshot.empty) {
          adsGrid.innerHTML = '<p>لا توجد إعلانات</p>';
        } else {
          let html = '';
          snapshot.forEach(doc => {
            const ad = doc.data();
            const adId = doc.id;
            const isOwner = currentUser && ad.userId === currentUser.uid;
            html += `
              <div class="ad-card" onclick="showAdDetail('${adId}')">
                ${isOwner ? `
                  <div class="ad-actions" onclick="event.stopPropagation()">
                    <button class="action-btn edit" onclick="editAd('${adId}')"><i class="fas fa-edit"></i></button>
                    <button class="action-btn delete" onclick="deleteAd('${adId}')"><i class="fas fa-trash"></i></button>
                  </div>
                ` : ''}
                <div class="ad-image"><img src="${ad.imageUrl}" alt="صورة"></div>
                <div class="ad-content">
                  <div class="ad-title">${ad.title}</div>
                  <div class="ad-price">${ad.price} ل.س</div>
                  <div class="ad-meta"><span>📍 ${ad.city}</span><span>📂 ${ad.category}</span></div>
                </div>
              </div>
            `;
          });
          adsGrid.innerHTML = html;
        }

        // قائمة الأقسام (للفلترة)
        const categories = ['عقارات', 'سيارات', 'جوالات', 'أثاث', 'ملابس', 'إلكترونيات'];
        categoryList.innerHTML = categories.map(cat => `<div class="category-item" data-cat="${cat}">${cat}</div>`).join('');
        // إضافة حدث الفلترة (يمكن تطويرها لاحقاً)
      } catch (error) {
        adsGrid.innerHTML = '<p>خطأ في التحميل</p>';
      }
    }

    // ملفي الشخصي
    myProfileBtn.addEventListener('click', async () => {
      if (!currentUser) return;
      const userDoc = await db.collection('users').doc(currentUser.uid).get();
      if (userDoc.exists) {
        const data = userDoc.data();
        document.getElementById('profileName').value = data.name || '';
        document.getElementById('profileEmail').value = currentUser.email || '';
        document.getElementById('profilePhone').value = data.phone || '';
        document.getElementById('profileWhatsapp').value = data.whatsapp || '';
      }
      pages.forEach(p => p.classList.remove('active-page'));
      profilePage.classList.add('active-page');
    });

    backFromProfileBtn.addEventListener('click', () => {
      document.querySelector('.nav-item[data-page="accountPage"]').click();
    });

    // إعلاناتي
    myAdsBtn.addEventListener('click', async () => {
      if (!currentUser) return;
      const snapshot = await db.collection('ads').where('userId', '==', currentUser.uid).get();
      const myAdsGrid = document.getElementById('myAdsGrid');
      if (snapshot.empty) {
        myAdsGrid.innerHTML = '<p>لا توجد إعلانات</p>';
      } else {
        let html = '';
        snapshot.forEach(doc => {
          const ad = doc.data();
          html += `<div class="ad-card"><div class="ad-image"><img src="${ad.imageUrl}"></div><div class="ad-content"><div class="ad-title">${ad.title}</div><div class="ad-price">${ad.price} ل.س</div></div></div>`;
        });
        myAdsGrid.innerHTML = html;
      }
      pages.forEach(p => p.classList.remove('active-page'));
      myAdsPage.classList.add('active-page');
    });

    backFromMyAdsBtn.addEventListener('click', () => {
      document.querySelector('.nav-item[data-page="accountPage"]').click();
    });

    // تسجيل الخروج
    logoutBtn.addEventListener('click', async () => {
      await auth.signOut();
      alert('تم الخروج');
      document.querySelector('.nav-item[data-page="homePage"]').click();
    });

    // بحث بسيط
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const term = e.target.value.trim().toLowerCase();
      const cards = document.querySelectorAll('.ad-card');
      cards.forEach(card => {
        const title = card.querySelector('.ad-title')?.textContent.toLowerCase() || '';
        card.style.display = title.includes(term) ? 'block' : 'none';
      });
    });

    // تحميل أولي
    loadFeaturedAdvertisers();
    loadAds();
  </script>
</body>
</html>
