<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سوق دير الزور - نسخة متكاملة</title>
  <!-- الخطوط والأيقونات -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background: linear-gradient(145deg, #1e2b3a 0%, #2c3e50 100%);
      min-height: 100vh;
      padding: 20px;
    }

    /* الحاوية الرئيسية */
    .app-wrapper {
      max-width: 1400px;
      margin: 0 auto;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 40px;
      padding: 25px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.2);
    }

    /* الهيدر */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 2px solid rgba(255,255,255,0.1);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 28px;
      font-weight: 700;
      color: white;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    .logo i {
      color: #f1c40f;
      font-size: 40px;
    }

    .user-section {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    /* الأزرار */
    .btn {
      padding: 12px 28px;
      border: none;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .btn-primary {
      background: #3498db;
      color: white;
    }
    .btn-primary:hover { background: #2980b9; transform: translateY(-2px); }

    .btn-success {
      background: #2ecc71;
      color: white;
    }
    .btn-success:hover { background: #27ae60; transform: translateY(-2px); }

    .btn-danger {
      background: #e74c3c;
      color: white;
    }
    .btn-danger:hover { background: #c0392b; transform: translateY(-2px); }

    .btn-outline {
      background: transparent;
      border: 2px solid #ecf0f1;
      color: white;
    }
    .btn-outline:hover { background: rgba(255,255,255,0.1); }

    .btn-warning {
      background: #f39c12;
      color: white;
    }
    .btn-warning:hover { background: #e67e22; }

    .btn-cloud {
      background: #1abc9c;
      color: white;
    }
    .btn-cloud:hover { background: #16a085; }

    .user-info {
      color: white;
      font-weight: 500;
      background: rgba(255,255,255,0.2);
      padding: 8px 20px;
      border-radius: 50px;
      backdrop-filter: blur(5px);
    }

    /* قائمة الأقسام */
    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
      background: rgba(0,0,0,0.2);
      padding: 15px;
      border-radius: 60px;
      backdrop-filter: blur(5px);
    }

    .category-item {
      padding: 8px 24px;
      border-radius: 50px;
      background: rgba(255,255,255,0.1);
      color: white;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 500;
    }

    .category-item:hover {
      background: rgba(255,255,255,0.3);
    }

    .category-item.active {
      background: #f1c40f;
      color: #2c3e50;
      font-weight: 700;
    }

    /* نموذج إضافة إعلان */
    .add-card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border-radius: 40px;
      padding: 30px;
      margin-bottom: 30px;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    .add-card h3 {
      color: white;
      font-size: 28px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .form-grid input,
    .form-grid textarea,
    .form-grid select {
      width: 100%;
      padding: 15px 20px;
      background: rgba(255,255,255,0.9);
      border: none;
      border-radius: 30px;
      font-size: 16px;
      transition: 0.3s;
    }

    .form-grid textarea {
      grid-column: span 2;
      resize: vertical;
      min-height: 100px;
    }

    .form-grid input:focus,
    .form-grid textarea:focus,
    .form-grid select:focus {
      outline: 2px solid #f1c40f;
      background: white;
    }

    .upload-area {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    .preview {
      max-width: 150px;
      max-height: 150px;
      border-radius: 20px;
      overflow: hidden;
      border: 3px solid #f1c40f;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #uploadStatus {
      color: white;
      font-weight: 500;
    }

    /* بطاقات الإعلانات */
    .ads-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 25px;
    }

    .ad-card {
      background: white;
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      transition: transform 0.3s, box-shadow 0.3s;
      position: relative;
    }

    .ad-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 30px 60px rgba(0,0,0,0.3);
    }

    .ad-image {
      height: 200px;
      background: #ecf0f1;
      position: relative;
    }

    .ad-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ad-actions {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .ad-card:hover .ad-actions {
      opacity: 1;
    }

    .action-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.7);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: 0.3s;
      backdrop-filter: blur(5px);
    }

    .action-btn.edit {
      background: #3498db;
    }
    .action-btn.edit:hover {
      background: #2980b9;
    }

    .action-btn.delete {
      background: #e74c3c;
    }
    .action-btn.delete:hover {
      background: #c0392b;
    }

    .ad-content {
      padding: 20px;
    }

    .ad-title {
      font-size: 20px;
      font-weight: 700;
      color: #2c3e50;
      margin-bottom: 5px;
    }

    .ad-description {
      color: #7f8c8d;
      font-size: 14px;
      margin-bottom: 15px;
      line-height: 1.5;
      height: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ad-price {
      background: linear-gradient(145deg, #3498db, #2980b9);
      color: white;
      padding: 5px 15px;
      border-radius: 50px;
      display: inline-block;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .ad-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #95a5a6;
      font-size: 13px;
      border-top: 1px solid #ecf0f1;
      padding-top: 10px;
    }

    .ad-category {
      background: #ecf0f1;
      padding: 4px 12px;
      border-radius: 50px;
      color: #2c3e50;
    }

    /* النوافذ المنبثقة (مودال) */
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 40px;
      border-radius: 50px;
      width: 90%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 30px 70px rgba(0,0,0,0.5);
    }

    .modal-content h2 {
      color: #2c3e50;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .modal-content input,
    .modal-content textarea,
    .modal-content select {
      width: 100%;
      padding: 15px 20px;
      margin: 10px 0;
      border: 2px solid #ecf0f1;
      border-radius: 30px;
      font-size: 16px;
    }

    .modal-content input:focus,
    .modal-content textarea:focus,
    .modal-content select:focus {
      border-color: #3498db;
      outline: none;
    }

    .modal-actions {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }

    .empty-state {
      text-align: center;
      padding: 50px;
      color: white;
      grid-column: 1 / -1;
      font-size: 20px;
      background: rgba(255,255,255,0.1);
      border-radius: 50px;
    }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <!-- الهيدر -->
    <div class="header">
      <div class="logo">
        <i class="fas fa-store-alt"></i>
        <span>سوق دير الزور</span>
      </div>
      <div class="user-section" id="userSection"></div>
    </div>

    <!-- قائمة الأقسام -->
    <div class="categories" id="categoriesContainer">
      <div class="category-item active" data-category="all">الكل</div>
      <div class="category-item" data-category="عقارات">عقارات</div>
      <div class="category-item" data-category="سيارات">سيارات</div>
      <div class="category-item" data-category="جوالات">جوالات</div>
      <div class="category-item" data-category="أثاث">أثاث</div>
      <div class="category-item" data-category="إلكترونيات">إلكترونيات</div>
    </div>

    <!-- قسم إضافة إعلان (للمسجلين فقط) -->
    <div class="add-card" id="addAdSection" style="display: none;">
      <h3><i class="fas fa-plus-circle"></i> أضف إعلانك</h3>
      <div class="form-grid">
        <input type="text" id="title" placeholder="عنوان الإعلان">
        <input type="text" id="price" placeholder="السعر">
        <select id="categorySelect">
          <option value="">اختر الفئة</option>
          <option value="عقارات">عقارات</option>
          <option value="سيارات">سيارات</option>
          <option value="جوالات">جوالات</option>
          <option value="أثاث">أثاث</option>
          <option value="إلكترونيات">إلكترونيات</option>
        </select>
        <textarea id="desc" placeholder="وصف الإعلان" style="grid-column: span 2;"></textarea>
      </div>

      <div class="upload-area">
        <button class="btn btn-cloud" id="uploadCloudinaryBtn"><i class="fas fa-cloud-upload-alt"></i> اختر صورة عبر Cloudinary</button>
        <span id="uploadStatus"></span>
      </div>
      <div class="preview" id="preview"></div>
      <input type="hidden" id="imageUrl">

      <button class="btn btn-success" id="addAdBtn" style="margin-top: 20px; width: 100%;"><i class="fas fa-paper-plane"></i> نشر الإعلان</button>
    </div>

    <!-- عرض الإعلانات -->
    <h2 style="color: white; margin-bottom: 20px;"><i class="fas fa-list"></i> أحدث الإعلانات</h2>
    <div id="ads" class="ads-grid"></div>
  </div>

  <!-- نوافذ المصادقة -->
  <div class="modal" id="loginModal">
    <div class="modal-content">
      <h2><i class="fas fa-sign-in-alt"></i> تسجيل الدخول</h2>
      <input type="email" id="loginEmail" placeholder="البريد الإلكتروني">
      <input type="password" id="loginPassword" placeholder="كلمة المرور">
      <div class="modal-actions">
        <button class="btn btn-primary" id="loginBtn" style="flex:1;">دخول</button>
        <button class="btn btn-outline" id="closeLoginBtn">إلغاء</button>
      </div>
    </div>
  </div>

  <div class="modal" id="signupModal">
    <div class="modal-content">
      <h2><i class="fas fa-user-plus"></i> إنشاء حساب</h2>
      <input type="email" id="signupEmail" placeholder="البريد الإلكتروني">
      <input type="password" id="signupPassword" placeholder="كلمة المرور">
      <div class="modal-actions">
        <button class="btn btn-primary" id="signupBtn" style="flex:1;">تسجيل</button>
        <button class="btn btn-outline" id="closeSignupBtn">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- نافذة تعديل الإعلان -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <h2><i class="fas fa-edit"></i> تعديل الإعلان</h2>
      <input type="text" id="editTitle" placeholder="عنوان الإعلان">
      <input type="text" id="editPrice" placeholder="السعر">
      <select id="editCategory">
        <option value="عقارات">عقارات</option>
        <option value="سيارات">سيارات</option>
        <option value="جوالات">جوالات</option>
        <option value="أثاث">أثاث</option>
        <option value="إلكترونيات">إلكترونيات</option>
      </select>
      <textarea id="editDesc" placeholder="وصف الإعلان" rows="3"></textarea>
      <div class="upload-area">
        <button class="btn btn-cloud" id="editUploadBtn"><i class="fas fa-cloud-upload-alt"></i> تغيير الصورة</button>
        <span id="editUploadStatus"></span>
      </div>
      <div class="preview" id="editPreview"></div>
      <input type="hidden" id="editImageUrl">
      <div class="modal-actions">
        <button class="btn btn-success" id="saveEditBtn" style="flex:1;">حفظ التعديلات</button>
        <button class="btn btn-outline" id="closeEditBtn">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- ================== إعدادات Firebase و Cloudinary ================== -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://upload-widget.cloudinary.com/global/all.js"></script>

  <script>
    // ---------- الإعدادات المركزية (عدّل هنا فقط) ----------
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyCTRpzhyBsf-h9rh2AO6OuIAy_kE7k7fpY",
      authDomain: "souq-aldeir-8b708.firebaseapp.com",
      projectId: "souq-aldeir-8b708",
      storageBucket: "souq-aldeir-8b708.firebasestorage.app",
      messagingSenderId: "718751448398",
      appId: "1:718751448398:web:b588ab6753d1fc7aa1321f"
    };

    const CLOUD_NAME = 'dzjy5tubx';                // ضع Cloud Name الخاص بك
    const UPLOAD_PRESET = 'souq-aldeir-prseset';   // ضع اسم upload preset

    // تهيئة Firebase
    firebase.initializeApp(FIREBASE_CONFIG);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // عناصر الصفحة
    const userSection = document.getElementById('userSection');
    const addAdSection = document.getElementById('addAdSection');
    const loginModal = document.getElementById('loginModal');
    const signupModal = document.getElementById('signupModal');
    const editModal = document.getElementById('editModal');
    const categoriesContainer = document.getElementById('categoriesContainer');
    const adsDiv = document.getElementById('ads');

    // متغيرات عامة
    let currentCategory = 'all';
    let currentEditId = null;           // ID الإعلان الذي نعدله حالياً
    let uploadedImageUrl = '';          // لرفع الصورة الجديدة
    let editUploadedImageUrl = '';      // لرفع الصورة في التعديل

    // ---------- وظائف المصادقة ----------
    function showLogin() { loginModal.classList.add('active'); }
    function showSignup() { signupModal.classList.add('active'); }
    function hideModals() {
      loginModal.classList.remove('active');
      signupModal.classList.remove('active');
      editModal.classList.remove('active');
    }

    // تحديث واجهة المستخدم حسب حالة الدخول
    auth.onAuthStateChanged(user => {
      if (user) {
        userSection.innerHTML = `
          <span class="user-info"><i class="fas fa-user-circle"></i> ${user.email}</span>
          <button class="btn btn-danger" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> تسجيل خروج</button>
        `;
        document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut());
        addAdSection.style.display = 'block';
      } else {
        userSection.innerHTML = `
          <button class="btn btn-outline" id="showLoginBtn"><i class="fas fa-sign-in-alt"></i> دخول</button>
          <button class="btn btn-primary" id="showSignupBtn"><i class="fas fa-user-plus"></i> تسجيل</button>
        `;
        document.getElementById('showLoginBtn').addEventListener('click', showLogin);
        document.getElementById('showSignupBtn').addEventListener('click', showSignup);
        addAdSection.style.display = 'none';
      }
    });

    // أحداث أزرار المصادقة
    document.getElementById('closeLoginBtn').addEventListener('click', hideModals);
    document.getElementById('closeSignupBtn').addEventListener('click', hideModals);
    document.getElementById('closeEditBtn').addEventListener('click', hideModals);

    document.getElementById('loginBtn').addEventListener('click', async () => {
      try {
        await auth.signInWithEmailAndPassword(
          document.getElementById('loginEmail').value,
          document.getElementById('loginPassword').value
        );
        hideModals();
      } catch (e) { alert('خطأ: ' + e.message); }
    });

    document.getElementById('signupBtn').addEventListener('click', async () => {
      try {
        await auth.createUserWithEmailAndPassword(
          document.getElementById('signupEmail').value,
          document.getElementById('signupPassword').value
        );
        hideModals();
      } catch (e) { alert('خطأ: ' + e.message); }
    });

    // ---------- Cloudinary Widget (للإضافة) ----------
    const cloudinaryWidget = cloudinary.createUploadWidget(
      { cloudName: CLOUD_NAME, uploadPreset: UPLOAD_PRESET, multiple: false, maxFileSize: 5000000, sources: ['local', 'camera'], language: 'ar' },
      (error, result) => {
        if (!error && result && result.event === 'success') {
          uploadedImageUrl = result.info.secure_url;
          document.getElementById('imageUrl').value = uploadedImageUrl;
          document.getElementById('uploadStatus').innerHTML = '<i class="fas fa-check-circle" style="color:green;"></i> تم رفع الصورة';
          document.getElementById('preview').innerHTML = `<img src="${uploadedImageUrl}" alt="صورة">`;
        } else if (error) {
          document.getElementById('uploadStatus').innerHTML = '<i class="fas fa-times-circle" style="color:red;"></i> فشل الرفع';
        }
      }
    );
    document.getElementById('uploadCloudinaryBtn').addEventListener('click', () => cloudinaryWidget.open());

    // ---------- Cloudinary Widget (للتعديل) ----------
    const editCloudinaryWidget = cloudinary.createUploadWidget(
      { cloudName: CLOUD_NAME, uploadPreset: UPLOAD_PRESET, multiple: false, maxFileSize: 5000000, sources: ['local', 'camera'], language: 'ar' },
      (error, result) => {
        if (!error && result && result.event === 'success') {
          editUploadedImageUrl = result.info.secure_url;
          document.getElementById('editImageUrl').value = editUploadedImageUrl;
          document.getElementById('editUploadStatus').innerHTML = '<i class="fas fa-check-circle" style="color:green;"></i> تم تغيير الصورة';
          document.getElementById('editPreview').innerHTML = `<img src="${editUploadedImageUrl}" alt="صورة">`;
        } else if (error) {
          document.getElementById('editUploadStatus').innerHTML = '<i class="fas fa-times-circle" style="color:red;"></i> فشل الرفع';
        }
      }
    );
    document.getElementById('editUploadBtn').addEventListener('click', () => editCloudinaryWidget.open());

    // ---------- إضافة إعلان ----------
    document.getElementById('addAdBtn').addEventListener('click', async () => {
      const user = auth.currentUser;
      if (!user) { alert('يجب تسجيل الدخول أولاً'); return; }

      const title = document.getElementById('title').value.trim();
      const desc = document.getElementById('desc').value.trim();
      const price = document.getElementById('price').value.trim();
      const category = document.getElementById('categorySelect').value;
      const imageUrl = document.getElementById('imageUrl').value.trim();

      if (!title || !desc || !price || !category || !imageUrl) {
        alert('يرجى ملء جميع الحقول ورفع صورة');
        return;
      }

      document.getElementById('addAdBtn').disabled = true;
      document.getElementById('addAdBtn').innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري النشر...';

      try {
        await db.collection('ads').add({
          title, description: desc, price, category,
          user: user.email,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          imageUrl
        });

        alert('تم النشر بنجاح');
        // تفريغ الحقول
        document.getElementById('title').value = '';
        document.getElementById('desc').value = '';
        document.getElementById('price').value = '';
        document.getElementById('categorySelect').value = '';
        document.getElementById('imageUrl').value = '';
        document.getElementById('uploadStatus').innerHTML = '';
        document.getElementById('preview').innerHTML = '';
        uploadedImageUrl = '';
      } catch (error) {
        alert('خطأ: ' + error.message);
      } finally {
        document.getElementById('addAdBtn').disabled = false;
        document.getElementById('addAdBtn').innerHTML = '<i class="fas fa-paper-plane"></i> نشر الإعلان';
      }
    });

    // ---------- فلترة الأقسام ----------
    categoriesContainer.addEventListener('click', (e) => {
      const item = e.target.closest('.category-item');
      if (!item) return;
      document.querySelectorAll('.category-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      currentCategory = item.dataset.category;
      loadAds();
    });

    // ---------- تحميل وعرض الإعلانات مع أزرار التعديل والحذف ----------
    function loadAds() {
      let query = db.collection('ads').orderBy('createdAt', 'desc');
      if (currentCategory !== 'all') {
        query = query.where('category', '==', currentCategory);
      }

      query.get().then(snapshot => {
        if (snapshot.empty) {
          adsDiv.innerHTML = '<div class="empty-state"><i class="fas fa-box-open fa-3x"></i><p>لا توجد إعلانات في هذا القسم</p></div>';
          return;
        }

        const currentUser = auth.currentUser;
        let html = '';
        snapshot.forEach(doc => {
          const ad = doc.data();
          const adId = doc.id;
          const date = ad.createdAt ? new Date(ad.createdAt.toDate()).toLocaleDateString('ar-EG') : '';

          // هل المستخدم الحالي هو صاحب الإعلان؟
          const isOwner = currentUser && ad.user === currentUser.email;

          html += `
            <div class="ad-card" data-id="${adId}">
              <div class="ad-image">
                <img src="${ad.imageUrl || 'https://via.placeholder.com/300x200?text=صورة'}" alt="صورة">
              </div>
              ${isOwner ? `
                <div class="ad-actions">
                  <button class="action-btn edit" onclick="openEditModal('${adId}')"><i class="fas fa-edit"></i></button>
                  <button class="action-btn delete" onclick="deleteAd('${adId}')"><i class="fas fa-trash"></i></button>
                </div>
              ` : ''}
              <div class="ad-content">
                <div class="ad-title">${ad.title}</div>
                <div class="ad-description">${ad.description}</div>
                <span class="ad-price">💰 ${ad.price}</span>
                <div class="ad-meta">
                  <span class="ad-category">📂 ${ad.category}</span>
                  <span>👤 ${ad.user.split('@')[0]}</span>
                  <span>📅 ${date}</span>
                </div>
              </div>
            </div>
          `;
        });
        adsDiv.innerHTML = html;
      }).catch(error => {
        adsDiv.innerHTML = '<div class="empty-state">خطأ في تحميل الإعلانات</div>';
        console.error(error);
      });
    }

    // استماع للتغييرات في الإعلانات
    db.collection('ads').orderBy('createdAt', 'desc').onSnapshot(() => {
      loadAds();
    });

    // ---------- حذف الإعلان ----------
    window.deleteAd = async (adId) => {
      if (!confirm('هل أنت متأكد من حذف هذا الإعلان؟')) return;
      try {
        await db.collection('ads').doc(adId).delete();
        alert('تم الحذف بنجاح');
      } catch (error) {
        alert('خطأ في الحذف: ' + error.message);
      }
    };

    // ---------- فتح نافذة التعديل ----------
    window.openEditModal = async (adId) => {
      currentEditId = adId;
      try {
        const doc = await db.collection('ads').doc(adId).get();
        if (!doc.exists) return;
        const ad = doc.data();

        // تعبئة الحقول
        document.getElementById('editTitle').value = ad.title || '';
        document.getElementById('editPrice').value = ad.price || '';
        document.getElementById('editCategory').value = ad.category || '';
        document.getElementById('editDesc').value = ad.description || '';
        document.getElementById('editImageUrl').value = ad.imageUrl || '';
        document.getElementById('editPreview').innerHTML = ad.imageUrl ? `<img src="${ad.imageUrl}" alt="صورة">` : '';
        document.getElementById('editUploadStatus').innerHTML = '';

        editUploadedImageUrl = ad.imageUrl || '';  // احتفاظ بالصورة القديمة كافتراضي
        editModal.classList.add('active');
      } catch (error) {
        alert('خطأ في تحميل بيانات الإعلان');
      }
    };

    // حفظ التعديلات
    document.getElementById('saveEditBtn').addEventListener('click', async () => {
      if (!currentEditId) return;

      const newTitle = document.getElementById('editTitle').value.trim();
      const newPrice = document.getElementById('editPrice').value.trim();
      const newCategory = document.getElementById('editCategory').value;
      const newDesc = document.getElementById('editDesc').value.trim();
      const newImageUrl = editUploadedImageUrl || document.getElementById('editImageUrl').value.trim();

      if (!newTitle || !newPrice || !newCategory || !newDesc || !newImageUrl) {
        alert('يرجى ملء جميع الحقول');
        return;
      }

      try {
        await db.collection('ads').doc(currentEditId).update({
          title: newTitle,
          price: newPrice,
          category: newCategory,
          description: newDesc,
          imageUrl: newImageUrl
        });
        alert('تم التعديل بنجاح');
        hideModals();
      } catch (error) {
        alert('خطأ في التعديل: ' + error.message);
      }
    });

    // تحميل أولي
    loadAds();
  </script>
</body>
</html>
