<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>سوق دير الزور</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f5f5f5;
}

header{

background:#fff;

padding:15px;

display:flex;

gap:10px;

align-items:center;

box-shadow:0 2px 8px rgba(0,0,0,.1);

}

.logo{

font-size:36px;

font-weight:bold;

}

.search{

flex:1;

padding:12px;

border:1px solid #ddd;

border-radius:12px;

}

.add{

padding:12px 18px;

border:none;

background:#1976ff;

color:white;

border-radius:12px;

}

.grid{

padding:20px;

display:grid;

grid-template-columns:
repeat(
auto-fill,
minmax(
280px,
1fr
)
);

gap:20px;

}

.card{

background:white;

border-radius:16px;

overflow:hidden;

}

.card img{

width:100%;

height:220px;

object-fit:cover;

}

.info{

padding:15px;

}

.price{

color:#0a9b38;

font-size:25px;

margin-top:10px;

}

.modal{

display:none;

position:fixed;

inset:0;

background:#0006;

}

.box{

background:white;

padding:20px;

margin:40px auto;

width:90%;

max-width:450px;

border-radius:20px;

display:flex;

flex-direction:column;

gap:10px;

}

.box input{

padding:12px;

}

.box button{

padding:12px;

}

</style>

</head>

<body>

<header>

<div class="logo">
🛒 سوق دير الزور
</div>

<input
class="search"
id="search"
placeholder="ابحث"
>

<button
class="add"
onclick="openBox()"
>
+ إعلان
</button>

</header>

<div
class="grid"
id="ads"
></div>

<div
class="modal"
id="modal"
>

<div class="box">

<input
id="title"
placeholder="العنوان"
>

<input
id="price"
placeholder="السعر"
>

<input
id="phone"
placeholder="الهاتف"
>

<input
type="file"
id="image"
>

<button
onclick="save()"
>

نشر

</button>

<button
onclick="closeBox()"
>

إغلاق

</button>

</div>

</div>

<script>

let data=
JSON.parse(
localStorage.getItem(
"ads"
)
)||[];

function openBox(){

modal.style.display=
"block";

}

function closeBox(){

modal.style.display=
"none";

}

function save(){

if(
!image.files[0]
)
return;

const reader=
new FileReader();

reader.onload=
()=>{

data.unshift({

title:
title.value,

price:
price.value,

phone:
phone.value,

image:
reader.result

});

localStorage.setItem(

"ads",

JSON.stringify(
data
)

);

render();

closeBox();

};

reader.readAsDataURL(

image.files[0]

);

}

function render(){

ads.innerHTML="";

const q=
search.value
.toLowerCase();

data

.filter(
x=>
x.title
.toLowerCase()
.includes(q)
)

.forEach(
a=>{

ads.innerHTML+=`

<div class="card">

<img
src="${a.image}"
>

<div class="info">

<h2>

${a.title}

</h2>

<div class="price">

${a.price}$

</div>

<div>

📞
${a.phone}

</div>

</div>

</div>

`;

}

);

}

search.oninput=
render;

render();

</script>

</body>
</html>
