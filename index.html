<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>سوق دير الزور</title>
</head>
<body>

<h2>تسجيل الدخول</h2>
<input id="email" placeholder="البريد">
<input id="password" type="password" placeholder="كلمة المرور">
<button onclick="login()">دخول</button>
<button onclick="signup()">تسجيل</button>

<hr>

<h2>نشر إعلان</h2>
<input id="title" placeholder="العنوان">
<input id="price" placeholder="السعر">
<input id="category" placeholder="الفئة">
<button onclick="publishAd()">نشر</button>

<hr>

<h2>الإعلانات</h2>
<button onclick="loadAds()">تحميل</button>
<div id="ads"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword }
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getDatabase, ref, push, get, child }
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCTRpzhyBsf-h9rh2AO6OuIAy_kE7k7fpY",
    authDomain: "souq-aldeir-8b708.firebaseapp.com",
    databaseURL: "https://souq-aldeir-8b708-default-rtdb.firebaseio.com",
    projectId: "souq-aldeir-8b708",
    storageBucket: "souq-aldeir-8b708.appspot.com",
    messagingSenderId: "718751448398",
    appId: "1:718751448398:web:b588ab6753d1fc7aa1321f"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  window.signup = () => {
    signInWithEmailAndPassword(auth,
      email.value, password.value
    ).catch(() =>
      createUserWithEmailAndPassword(auth, email.value, password.value)
    );
  };

  window.login = () => {
    signInWithEmailAndPassword(auth, email.value, password.value)
      .alert("تم الدخول");
  };

  window.publishAd = async () => {
    await push(ref(db, "ads"), {
      title: title.value,
      price: price.value,
      category: category.value
    });
    alert("تم النشر");
  };

  window.loadAds = async () => {
    const snapshot = await get(child(ref(db), "ads"));
    ads.innerHTML = "";
    if (snapshot.exists()) {
      Object.values(snapshot.val()).forEach(ad => {
        ads.innerHTML += `<div>
          <b>${ad.title}</b> - ${ad.price} - ${ad.category}
        </div>`;
      });
    }
  };
</script>

</body>
</html>
