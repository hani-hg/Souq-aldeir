<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سوق دير الزور المفتوح</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="src/CSS/style.css">
</head>
<body>

<!-- HEADER -->
<header class="topnav">
  <div class="logo-wrap"><div class="logo-icon">🛒</div><div class="logo-text">سوق دير الزور<small>أول سوق إلكتروني</small></div></div>
  <div class="nav-btns">
    <button class="nav-btn" id="adminBtn" style="display:none" onclick="window.openAdmin()" title="المدير"><i class="fa fa-shield-alt"></i></button>
    <button class="nav-btn" id="msgBtn" onclick="window.openMsgs()" title="رسائل"><i class="fa fa-comment-dots"></i></button>
    <button class="nav-btn" id="userBtn" onclick="window.onUserBtn()"><i class="fa fa-user"></i></button>
  </div>
</header>

<div class="news-bar"><div class="news-label">📢 أخبار</div><div class="news-track"><div class="news-inner" id="newsInner"></div></div></div>

<div class="searchbar"><div class="search-wrap"><i class="fa fa-search"></i><input id="searchQ" type="text" placeholder="ابحث في سوق دير الزور..."></div></div>

<div class="cats-scroll" id="catsEl"></div>

<div class="filter-bar"><span class="ads-count" id="adsCountEl">جاري...</span><select class="sort-select" id="sortEl" onchange="window.applyFilter()"><option value="new">الأحدث</option><option value="asc">السعر: الأقل</option><option value="desc">السعر: الأعلى</option></select></div>

<div class="slider-section" id="sliderEl"><div class="slider-track" id="sliderTrack"></div><div class="slider-arrows"><button class="sarrow" onclick="window.slideTo(window.curSlide-1)"><i class="fa fa-chevron-right"></i></button><button class="sarrow" onclick="window.slideTo(window.curSlide+1)"><i class="fa fa-chevron-left"></i></button></div><div class="slider-dots" id="sliderDots"></div></div>

<button class="promo-btn" onclick="window.openFeatured()"><div><h4>⭐ أبرز إعلانك</h4><p>وصل لآلاف المشترين</p></div><div style="font-size:2em">🚀</div></button>

<div class="ads-wrap"><div class="ads-grid" id="adsGrid"><div class="loading-state"><i class="fa fa-spinner fa-spin"></i><p>جاري التحميل...</p></div></div></div>

<button class="fab" id="fabBtn"><i class="fa fa-plus"></i> أضف إعلان</button>

<nav class="bnav">
  <button class="bnav-btn on" id="bn-home" onclick="window.setBnav('home')"><i class="fa fa-home"></i><span>الرئيسية</span></button>
  <button class="bnav-btn" id="bn-fav" onclick="window.setBnav('fav');window.openFavs()"><i class="fa fa-heart"></i><span>المفضلة</span></button>
  <button class="bnav-btn" id="bn-add" onclick="window.setBnav('add');document.getElementById('fabBtn').click()"><i class="fa fa-plus-circle"></i><span>أضف</span></button>
  <button class="bnav-btn" id="bn-msg" onclick="window.setBnav('msg');window.openMsgs()"><i class="fa fa-comment-dots"></i><span>رسائل</span></button>
  <button class="bnav-btn" id="bn-me" onclick="window.setBnav('me');window.openDash()"><i class="fa fa-user-circle"></i><span>حسابي</span></button>
</nav>

<!-- MODALS -->
<div class="modal" id="authModal"><div class="sheet"><div class="handle"></div><div class="sheet-head"><span class="sheet-title">الدخول إلى السوق</span><button class="xbtn" onclick="window.closeM('authModal')">✕</button></div><div class="tab-bar"><button class="tab-btn on" onclick="window.switchAuth('login')">دخول</button><button class="tab-btn" onclick="window.switchAuth('signup')">حساب جديد</button><button class="tab-btn" onclick="window.switchAuth('reset')">نسيت كلمة المرور</button></div><div class="errmsg" id="authErr"></div><div class="sucmsg" id="authSuc"></div><div id="pLogin"></div><div id="pSignup" style="display:none"></div><div id="pReset" style="display:none"></div></div></div>

<div class="modal" id="addModal"><div class="sheet"><div class="handle"></div><div class="sheet-head"><span class="sheet-title">نشر إعلان جديد</span><button class="xbtn" onclick="window.closeM('addModal')">✕</button></div><div class="errmsg" id="addErr"></div><div class="fg"><label>عنوان الإعلان *</label><input type="text" id="adT"></div><div class="fg"><label>الوصف *</label><textarea id="adD"></textarea></div><div class="row2"><div class="fg"><label>السعر ($) *</label><input type="number" id="adPr" min="0"></div><div class="fg"><label>رقم الهاتف *</label><input type="tel" id="adPh"></div></div><div class="fg"><label>الفئة *</label><select id="adCat"><option value="">اختر...</option></select></div><div class="fg"><label>المنطقة</label><select id="adArea"><option value="دير الزور">دير الزور - المدينة</option><option value="الميادين">الميادين</option><option value="البوكمال">البوكمال</option><option value="الموحسن">الموحسن</option><option value="عشارة">عشارة</option><option value="أخرى">منطقة أخرى</option></select></div><div class="fg"><label>صورة (اختياري)</label><input type="file" id="adImg" accept="image/*"><div id="imgPrev"></div></div><button id="addBtn" class="btn btn-orange" onclick="window.doAddAd()"><i class="fa fa-paper-plane"></i> نشر الإعلان</button></div></div>

<div class="modal" id="editModal"><div class="sheet"><div class="handle"></div><div class="sheet-head"><span class="sheet-title">تعديل الإعلان</span><button class="xbtn" onclick="window.closeM('editModal')">✕</button></div><div class="errmsg" id="editErr"></div><input type="hidden" id="edId"><div class="fg"><label>العنوان *</label><input type="text" id="edT"></div><div class="fg"><label>الوصف *</label><textarea id="edD"></textarea></div><div class="row2"><div class="fg"><label>السعر ($)</label><input type="number" id="edPr" min="0"></div><div class="fg"><label>رقم الهاتف</label><input type="tel" id="edPh"></div></div><div class="fg"><label>الفئة</label><select id="edCat"></select></div><button class="btn btn-blue" onclick="window.doEditAd()"><i class="fa fa-save"></i> حفظ التعديلات</button></div></div>

<div class="modal" id="detailModal"><div class="sheet"><div class="handle"></div><div class="sheet-head"><span class="sheet-title">تفاصيل الإعلان</span><button class="xbtn" onclick="window.closeM('detailModal')">✕</button></div><div id="detailBody"></div></div></div>

<div class="modal" id="dashModal"><div class="sheet"><div class="handle"></div><div class="sheet-head"><span class="sheet-title">حسابي</span><button class="xbtn" onclick="window.closeM('dashModal')">✕</button></div><div id="dashBody"></div></div></div>

<div class="modal" id="msgModal"><div class="sheet"><div class="handle"></div><div class="sheet-head"><span class="sheet-title" id="msgTitle">الرسائل</span><button class="xbtn" onclick="window.closeM('msgModal');window.stopChat()">✕</button></div><div id="msgBody"></div></div></div>

<div class="modal" id="featModal"><div class="sheet"><div class="handle"></div><div class="sheet-head"><span class="sheet-title">⭐ إعلانات مميزة</span><button class="xbtn" onclick="window.closeM('featModal')">✕</button></div><p style="font-size:.85em;color:#6b7280;margin-bottom:14px">أبرز إعلانك أمام آلاف المشترين في دير الزور</p><div class="plans-grid" id="plansGrid"></div><div class="fg"><label>اختر إعلانك</label><select id="featAdSel"><option value="">-- اختر إعلانك --</option></select></div><button class="btn btn-gold" onclick="window.reqFeatured()"><i class="fa fa-star"></i> طلب التمييز</button><p style="font-size:.73em;color:#6b7280;text-align:center;margin-top:8px">سيتم التواصل معك عبر واتساب</p></div></div>

<div class="modal" id="favModal"><div class="sheet"><div class="handle"></div><div class="sheet-head"><span class="sheet-title">❤️ المفضلة</span><button class="xbtn" onclick="window.closeM('favModal')">✕</button></div><div id="favBody"></div></div></div>

<div class="modal" id="adminModal"><div class="sheet"><div class="handle"></div><div class="sheet-head"><span class="sheet-title">🛡️ لوحة تحكم المدير</span><button class="xbtn" onclick="window.closeM('adminModal')">✕</button></div><div id="adminBody"></div></div></div>

<div class="toast" id="toastEl"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

<!-- App Scripts - حسب الهيكل الجديد -->
<script src="src/js/Firebase/config.js"></script>
<script src="src/js/utils/helpers.js"></script>
<script src="src/components/slider.js"></script>
<script src="src/js/Firebase/auth.js"></script>
<script src="src/js/Firebase/storage.js"></script>
<script src="src/js/modules/ads.js"></script>
<script src="src/js/modules/chat.js"></script>
<script src="src/js/modules/cart.js"></script>
<script src="src/js/modules/products.js"></script>
<script src="src/js/admin/dashboard.js"></script>
<script src="src/js/admin/users.js"></script>
<script src="src/components/modal.js"></script>
<script src="src/components/toast.js"></script>
<script src="src/components/navbar.js"></script>
<script src="src/js/utils/rtl.js"></script>

<script>
// التهيئة العامة (app.js)
document.addEventListener('DOMContentLoaded', function() {
  db.collection('news').orderBy('createdAt', 'desc').limit(10).get().then(snap => {
    const inner = document.getElementById('newsInner');
    inner.innerHTML = snap.docs.map(d => d.data().text).join(' • ') + ' • ' + snap.docs.map(d => d.data().text).join(' • ');
  });
  db.collection('categories').orderBy('name').get().then(snap => {
    const catsEl = document.getElementById('catsEl');
    catsEl.innerHTML = `<button class="cat-pill active" onclick="window.loadAds('')">الكل</button>`;
    snap.forEach(doc => {
      catsEl.innerHTML += `<button class="cat-pill" onclick="window.loadAds('${doc.id}');this.classList.add('active');">${doc.data().name}</button>`;
    });
  });
  window.loadSlider([
    'https://via.placeholder.com/800x200?text=عرض+خاص',
    'https://via.placeholder.com/800x200?text=سوق+دير+الزور'
  ]);
  window.openFeatured = function() { window.showToast('سيتم التواصل معك قريباً'); };
  window.reqFeatured = function() { window.showToast('تم إرسال طلب التمييز'); };
  window.setBnav = function(tab) {
    document.querySelectorAll('.bnav-btn').forEach(b => b.classList.remove('on'));
    document.getElementById('bn-' + tab).classList.add('on');
  };
  document.getElementById('fabBtn').addEventListener('click', function() {
    if (!auth.currentUser) return window.onUserBtn();
    window.openM('addModal');
  });
});
</script>

</body>
</html>
