<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>اختبار Firebase الأساسي</title>
</head>
<body>
    <h2>🔍 اختبار تحميل Firebase</h2>
    <div id="result">⏳ جاري تحميل المكتبات...</div>

    <!-- تحميل Firebase App فقط -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>

    <script>
        setTimeout(() => {
            if (typeof firebase !== 'undefined') {
                document.getElementById('result').innerText = '✅ تم تحميل مكتبات Firebase بنجاح!';
            } else {
                document.getElementById('result').innerText = '❌ فشل تحميل مكتبات Firebase. قد يكون الرابط محجوباً.';
            }
        }, 2000);
    </script>
</body>
</html>
