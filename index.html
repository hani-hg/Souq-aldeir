<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>اختبار Firebase</title></head>
<body>
    <h2>اختبار تسجيل الدخول</h2>
    <input id="email" placeholder="البريد"><br>
    <input id="pass" type="password" placeholder="كلمة المرور"><br>
    <button id="signup">إنشاء حساب</button>
    <button id="login">دخول</button>
    <div id="result"></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBHd91xmAN33q-P5eSk9hRDsvxuzuV7sUE",
            authDomain: "souq-aldeir-e0534.firebaseapp.com",
            projectId: "souq-aldeir-e0534"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        document.getElementById('signup').onclick = () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            auth.createUserWithEmailAndPassword(email, pass)
                .then(() => document.getElementById('result').innerText = '✅ تم إنشاء الحساب')
                .catch(e => document.getElementById('result').innerText = '❌ خطأ: ' + e.message);
        };
        document.getElementById('login').onclick = () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            auth.signInWithEmailAndPassword(email, pass)
                .then(() => document.getElementById('result').innerText = '✅ تم الدخول')
                .catch(e => document.getElementById('result').innerText = '❌ خطأ: ' + e.message);
        };
    </script>
</body>
</html>
