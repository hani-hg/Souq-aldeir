<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>اختبار Firebase</title></head>
<body>
    <div id="result">جاري الاتصال بـ Firebase...</div>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2FhsRlX4SMpGhzfI0oq_lArSsPTGHUsY",
            authDomain: "souq-aldeir-4ed7b.firebaseapp.com",
            projectId: "souq-aldeir-4ed7b",
            storageBucket: "souq-aldeir-4ed7b.firebasestorage.app",
            messagingSenderId: "925621854708",
            appId: "1:925621854708:web:97c1b7718cc6ea25be99a1"
        };
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        db.collection('categories').get()
            .then(snapshot => {
                if (snapshot.empty) {
                    document.getElementById('result').innerText = '✅ اتصل بنجاح، لكن لا توجد فئات في المجموعة. أضف فئات.';
                } else {
                    let names = [];
                    snapshot.forEach(doc => names.push(doc.data().name));
                    document.getElementById('result').innerText = '✅ تم التحميل: ' + names.join(', ');
                }
            })
            .catch(error => {
                document.getElementById('result').innerText = '❌ خطأ: ' + error.message;
            });
    </script>
</body>
</html>
