<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق دير الزور</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
    <style>
        /* ===== ROOT ===== */
        :root {
            --blue: #1565c0;
            --blue2: #1976d2;
            --orange: #f57c00;
            --green: #2e7d32;
            --bg: #f2f4f8;
            --white: #fff;
            --border: #e0e4ef;
            --gray: #6b7280;
            --dark: #1a1f36;
            --radius: 12px;
            --shadow: 0 2px 12px rgba(21, 101, 192, .10);
            --premium-gold: #ffd700;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--dark);
            padding-bottom: 75px;
        }
        a {
            text-decoration: none;
            color: inherit;
        }

        /* ===== TOP NAV ===== */
        .topnav {
            position: sticky;
            top: 0;
            z-index: 200;
            background: var(--blue);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .topnav-logo {
            color: #fff;
            font-size: 1.15em;
            font-weight: 800;
            flex: 1;
        }
        .topnav-logo span {
            color: #ffd54f;
        }
        .topnav-icons {
            display: flex;
            gap: 8px;
        }
        .topnav-icons button {
            background: rgba(255, 255, 255, .15);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1em;
            cursor: pointer;
            transition: .2s;
            position: relative;
        }
        .topnav-icons button:hover {
            background: rgba(255, 255, 255, .25);
        }
        .topnav-icons .badge-dot {
            position: absolute;
            top: 3px;
            right: 3px;
            width: 10px;
            height: 10px;
            background: #ef5350;
            border-radius: 50%;
            border: 2px solid var(--blue);
        }

        /* ===== SEARCH ===== */
        .searchbar {
            background: var(--blue2);
            padding: 10px 14px 14px;
        }
        .search-wrap {
            display: flex;
            gap: 8px;
            background: #fff;
            border-radius: 50px;
            padding: 6px 12px;
            align-items: center;
        }
        .search-wrap input {
            flex: 1;
            border: none;
            outline: none;
            font-size: .95em;
            font-family: 'Tajawal', sans-serif;
            color: var(--dark);
        }
        .search-wrap i {
            color: var(--gray);
        }

        /* ===== CATEGORIES ===== */
        .cats-scroll {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 10px 14px;
            overflow-x: auto;
            white-space: nowrap;
            display: flex;
            gap: 8px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .cats-scroll::-webkit-scrollbar {
            display: none;
        }
        .cat-chip {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 8px 14px;
            cursor: pointer;
            min-width: 70px;
            transition: all .2s;
            gap: 4px;
            flex-shrink: 0;
        }
        .cat-chip.active,
        .cat-chip:hover {
            background: var(--blue);
            border-color: var(--blue);
            color: #fff;
        }
        .cat-chip i {
            font-size: 1.3em;
            color: var(--blue);
        }
        .cat-chip.active i,
        .cat-chip:hover i {
            color: #fff;
        }
        .cat-chip span {
            font-size: .75em;
            font-weight: 600;
        }

        /* ===== FILTER BAR ===== */
        .filter-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: var(--white);
            border-bottom: 1px solid var(--border);
            gap: 8px;
            flex-wrap: wrap;
        }
        .filter-bar .count {
            font-size: .88em;
            color: var(--gray);
        }
        .filter-bar .actions {
            display: flex;
            gap: 6px;
        }
        .sort-btn {
            border: 1.5px solid var(--border);
            background: #fff;
            border-radius: 20px;
            padding: 5px 12px;
            font-size: .82em;
            font-family: 'Tajawal', sans-serif;
            color: var(--dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .sort-btn:hover {
            background: var(--bg);
        }

        /* ===== PREMIUM BANNER ===== */
        .premium-banner {
            background: linear-gradient(135deg, #fff8e1, #ffecb3);
            border-bottom: 2px solid var(--premium-gold);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .premium-banner::-webkit-scrollbar {
            display: none;
        }
        .premium-banner .label {
            font-weight: 700;
            color: #e65100;
            font-size: .8em;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            background: rgba(255, 215, 0, .3);
            padding: 4px 12px;
            border-radius: 20px;
        }
        .premium-banner .label i {
            color: #f9a825;
        }
        .premium-slide {
            display: flex;
            gap: 10px;
            flex: 1;
        }
        .premium-item {
            flex-shrink: 0;
            background: var(--white);
            border-radius: 10px;
            padding: 6px 14px 6px 10px;
            box-shadow: 0 1px 6px rgba(0, 0, 0, .08);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            border: 1px solid #ffe082;
            transition: .2s;
        }
        .premium-item:hover {
            transform: scale(1.02);
            border-color: var(--orange);
        }
        .premium-item img {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            object-fit: cover;
            background: #eee;
        }
        .premium-item .info .p-title {
            font-size: .75em;
            font-weight: 700;
        }
        .premium-item .info .p-price {
            font-size: .7em;
            color: var(--green);
            font-weight: 700;
        }

        /* ===== ADS GRID ===== */
        .ads-container {
            padding: 12px 12px 0;
        }
        .ads-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .ad-card {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: transform .18s;
            position: relative;
        }
        .ad-card:active {
            transform: scale(.97);
        }
        .ad-card.premium {
            border: 2px solid var(--premium-gold);
        }
        .ad-card.premium::before {
            content: '⭐ مميز';
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--orange);
            color: #fff;
            font-size: .65em;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
            z-index: 5;
        }
        .ad-img-wrap {
            position: relative;
        }
        .ad-img {
            width: 100%;
            height: 145px;
            object-fit: cover;
            background: linear-gradient(135deg, #dde4f5, #c5d0ea);
            display: block;
        }
        .ad-no-img {
            width: 100%;
            height: 145px;
            background: linear-gradient(135deg, #dde4f5, #c5d0ea);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aab;
            font-size: 2.2em;
        }
        .ad-fav {
            position: absolute;
            top: 7px;
            left: 7px;
            background: rgba(255, 255, 255, .85);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .9em;
            cursor: pointer;
            color: #ccc;
            transition: .2s;
        }
        .ad-fav.active {
            color: #e53935;
        }
        .ad-badge {
            position: absolute;
            bottom: 7px;
            right: 7px;
            background: var(--orange);
            color: #fff;
            font-size: .7em;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
        }
        .ad-body {
            padding: 9px 10px 11px;
            position: relative;
        }
        .ad-price {
            font-size: 1.05em;
            font-weight: 800;
            color: var(--green);
            margin-bottom: 3px;
        }
        .ad-title {
            font-size: .88em;
            color: var(--dark);
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }
        .ad-loc {
            font-size: .75em;
            color: var(--gray);
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .ad-time {
            font-size: .7em;
            color: #aab;
            margin-top: 4px;
        }
        .ad-actions {
            position: absolute;
            bottom: 9px;
            left: 10px;
            display: flex;
            gap: 6px;
        }
        .ad-actions button {
            background: rgba(255, 255, 255, .9);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: .7em;
            cursor: pointer;
            box-shadow: 0 1px 6px rgba(0, 0, 0, .12);
            transition: .2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ad-actions button:hover {
            transform: scale(1.1);
        }
        .ad-actions .edit-btn {
            color: var(--blue);
        }
        .ad-actions .del-btn {
            color: #c62828;
        }

        /* ===== EMPTY / LOADING ===== */
        .empty-state {
            grid-column: 1/-1;
            text-align: center;
            padding: 50px 20px;
            color: var(--gray);
        }
        .empty-state i {
            font-size: 3em;
            opacity: .3;
            display: block;
            margin-bottom: 10px;
        }
        .loading {
            grid-column: 1/-1;
            text-align: center;
            padding: 40px;
            color: var(--gray);
        }
        .loading i {
            font-size: 1.8em;
            color: var(--blue);
            display: block;
            margin-bottom: 8px;
        }

        /* ===== FAB ===== */
        .fab {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 150;
            background: var(--orange);
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 13px 28px;
            font-size: 1em;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            box-shadow: 0 4px 20px rgba(245, 124, 0, .45);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform .2s;
        }
        .fab:active {
            transform: translateX(-50%) scale(.95);
        }

        /* ===== BOTTOM NAV ===== */
        .bottomnav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 200;
            background: var(--white);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 0 10px;
        }
        .bnav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: .68em;
            color: var(--gray);
            cursor: pointer;
            border: none;
            background: none;
            font-family: 'Tajawal', sans-serif;
            padding: 0 12px;
            transition: .2s;
        }
        .bnav-item i {
            font-size: 1.4em;
        }
        .bnav-item.active {
            color: var(--blue);
        }
        .bnav-item .msg-badge {
            position: relative;
        }
        .bnav-item .msg-badge .badge-num {
            position: absolute;
            top: -6px;
            right: -10px;
            background: #ef5350;
            color: #fff;
            font-size: .6em;
            font-weight: 700;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== MODALS ===== */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 20, 50, .55);
            z-index: 999;
            justify-content: center;
            align-items: flex-end;
            backdrop-filter: blur(2px);
        }
        .modal.active {
            display: flex;
        }
        .modal-sheet {
            background: var(--white);
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            padding: 20px 18px 30px;
            animation: slideup .25s ease;
        }
        @keyframes slideup {
            from {
                transform: translateY(60px);
                opacity: 0
            }
            to {
                transform: translateY(0);
                opacity: 1
            }
        }
        .sheet-handle {
            width: 40px;
            height: 4px;
            background: #ddd;
            border-radius: 4px;
            margin: 0 auto 16px;
        }
        .sheet-title {
            font-size: 1.15em;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 16px;
        }
        .close-sheet {
            float: left;
            background: none;
            border: none;
            font-size: 1.4em;
            color: var(--gray);
            cursor: pointer;
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 13px;
        }
        .form-group label {
            display: block;
            font-size: .85em;
            font-weight: 700;
            color: var(--gray);
            margin-bottom: 5px;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 11px 13px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: .95em;
            font-family: 'Tajawal', sans-serif;
            color: var(--dark);
            outline: none;
            background: var(--bg);
            transition: .2s;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--blue);
            background: #fff;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 75px;
        }
        .row2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn-full {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 50px;
            font-size: 1em;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
            transition: .2s;
        }
        .btn-full:disabled {
            opacity: .6;
            cursor: not-allowed;
        }
        .btn-blue {
            background: var(--blue);
            color: #fff;
        }
        .btn-blue:hover {
            background: #0d47a1;
        }
        .btn-orange {
            background: var(--orange);
            color: #fff;
        }
        .btn-orange:hover {
            background: #e65100;
        }
        .btn-green {
            background: var(--green);
            color: #fff;
        }
        .btn-green:hover {
            background: #1b5e20;
        }
        .btn-outline {
            background: #fff;
            border: 1.5px solid var(--blue);
            color: var(--blue);
        }
        .btn-outline:hover {
            background: var(--blue);
            color: #fff;
        }
        .btn-danger {
            background: #c62828;
            color: #fff;
        }
        .btn-danger:hover {
            background: #b71c1c;
        }
        .err {
            color: #c62828;
            font-size: .82em;
            padding: 7px 10px;
            background: #fff3f3;
            border-radius: 8px;
            margin-bottom: 10px;
            display: none;
        }
        .err.show {
            display: block;
        }
        #imgPreview img {
            width: 100%;
            border-radius: 10px;
            margin-top: 8px;
            max-height: 200px;
            object-fit: cover;
        }

        /* ===== DETAIL ===== */
        .detail-img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 14px;
            margin-bottom: 12px;
        }
        .detail-price {
            font-size: 1.5em;
            font-weight: 800;
            color: var(--green);
            margin: 8px 0;
        }
        .detail-desc {
            color: var(--gray);
            line-height: 1.75;
            margin-bottom: 14px;
            font-size: .95em;
        }
        .detail-info {
            background: var(--bg);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
        }
        .detail-info-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 0;
            font-size: .9em;
        }
        .detail-info-row i {
            color: var(--blue);
            width: 18px;
            text-align: center;
        }
        .call-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #e8f5e9;
            color: var(--green);
            border: 1.5px solid #a5d6a7;
            border-radius: 12px;
            padding: 12px;
            font-weight: 700;
            font-size: 1em;
            text-decoration: none;
            margin-top: 8px;
        }
        .call-btn:hover {
            background: #c8e6c9;
        }

        /* ===== CHAT ===== */
        .chat-list {
            max-height: 300px;
            overflow-y: auto;
            margin: 10px 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .chat-msg {
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 85%;
            font-size: .9em;
            word-wrap: break-word;
        }
        .chat-msg.me {
            background: var(--blue);
            color: #fff;
            align-self: flex-end;
        }
        .chat-msg.other {
            background: var(--bg);
            color: var(--dark);
            align-self: flex-start;
        }
        .chat-msg .meta {
            font-size: .65em;
            opacity: .7;
            margin-top: 4px;
            display: block;
        }
        .chat-input-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .chat-input-row input {
            flex: 1;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 50px;
            font-size: .9em;
            outline: none;
            font-family: 'Tajawal', sans-serif;
        }
        .chat-input-row input:focus {
            border-color: var(--blue);
        }
        .chat-input-row button {
            background: var(--blue);
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 10px 20px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }
        .chat-input-row button:hover {
            background: #0d47a1;
        }
        .chat-user-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 8px 0;
        }
        .chat-user-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--bg);
            border-radius: 12px;
            cursor: pointer;
            transition: .2s;
        }
        .chat-user-item:hover {
            background: #e3e8f0;
        }
        .chat-user-item .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--blue);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1em;
        }
        .chat-user-item .uname {
            font-weight: 600;
        }
        .chat-user-item .last-msg {
            font-size: .78em;
            color: var(--gray);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            background: var(--dark);
            color: #fff;
            padding: 10px 22px;
            border-radius: 50px;
            font-size: .88em;
            font-weight: 600;
            z-index: 9999;
            opacity: 0;
            transition: all .3s;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.ok {
            background: var(--green);
        }
        .toast.bad {
            background: #c62828;
        }

        /* ===== RESPONSIVE ===== */
        @media(min-width:480px) {
            .ads-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media(min-width:768px) {
            .ads-grid {
                grid-template-columns: repeat(4, 1fr);
            }
            .topnav-logo {
                font-size: 1.3em;
            }
            .modal-sheet {
                max-width: 500px;
                border-radius: 20px;
                margin: 20px auto;
                max-height: 90vh;
            }
            .modal {
                align-items: center;
            }
            .fab {
                bottom: 100px;
            }
            .toast {
                bottom: 100px;
            }
        }
        @media(max-width:380px) {
            .ads-grid {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }
            .ad-img {
                height: 110px;
            }
            .ad-no-img {
                height: 110px;
            }
            .cat-chip {
                padding: 6px 10px;
                min-width: 60px;
                font-size: .85em;
            }
        }
    </style>
</head>
<body>

    <!-- ===== TOP NAV ===== -->
    <div class="topnav">
        <div class="topnav-logo">🛒 <span>سوق</span> دير الزور</div>

    <!-- ===== FIREBASE ===== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-app.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-auth.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-firestore.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-storage.min.js">
    </script>

    <script>
        (function() {
            'use strict';

            /* ===== FIREBASE CONFIG ===== */
            firebase.initializeApp({
                apiKey: "AIzaSyCTRpzhyBsf-h9rh2AO6OuIAy_kE7k7fpY",
                authDomain: "souq-aldeir-8b708.firebaseapp.com",
                projectId: "souq-aldeir-8b708",
                storageBucket: "souq-aldeir-8b708.firebasestorage.app",
                messagingSenderId: "718751448398",
                appId: "1:718751448398:web:b588ab6753d1fc7aa1321f"
            });
            const auth = firebase.auth(),
                db = firebase.firestore(),
                st = firebase.storage();

            let currentUser = null;
            let allAds = [];
            let activeCat = null;
            let isSignup = false;
            let sortMode = 'newest'; // newest | price_asc | price_desc
            let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
            let currentChatUserId = null;
            let chatUnsubscribe = null;
            let isPremiumFilter = false;

            /* ===== HELPERS ===== */
            window.showToast = function(msg, type = '') {
                const t = document.getElementById('toast');
                t.textContent = msg;
                t.className = 'toast ' + type + ' show';
                clearTimeout(t._timer);
                t._timer = setTimeout(() => t.className = 'toast', 2800);
            };

            function timeAgo(ts) {
                if (!ts) return '';
                const d = ts.toDate ? ts.toDate() : new Date(ts);
                const s = Math.floor((Date.now() - d) / 1000);
                if (s < 60) return 'الآن';
                if (s < 3600) return Math.floor(s / 60) + ' دقيقة';
                if (s < 86400) return Math.floor(s / 3600) + ' ساعة';
                if (s < 604800) return Math.floor(s / 86400) + ' يوم';
                return d.toLocaleDateString('ar');
            }

            function getUserDisplayName(u) {
                if (!u) return 'مستخدم';
                return u.displayName || u.email || u.phoneNumber || 'مستخدم';
            }

            function getInitials(name) {
                if (!name) return '👤';
                const parts = name.split(' ');
                if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
                return name.substring(0, 2).toUpperCase();
            }

            function isOwner(ad) {
                return currentUser && ad.userId === currentUser.uid;
            }

            /* ===== CATEGORIES ===== */
            const CATS = [
                { n: 'الكل', i: 'fas fa-th-large' },
                { n: 'سيارات', i: 'fas fa-car' },
                { n: 'عقارات', i: 'fas fa-home' },
                { n: 'إلكترونيات', i: 'fas fa-mobile-alt' },
                { n: 'ملابس', i: 'fas fa-tshirt' },
                { n: 'أثاث', i: 'fas fa-couch' },
                { n: 'وظائف', i: 'fas fa-briefcase' },
                { n: 'خدمات', i: 'fas fa-tools' },
                { n: 'حيوانات', i: 'fas fa-paw' },
                { n: 'رياضة', i: 'fas fa-futbol' },
                { n: 'أخرى', i: 'fas fa-box' },
            ];

            function renderCats() {
                const c = document.getElementById('catsScroll');
                c.innerHTML = CATS.map(cat =>
                    `<div class="cat-chip ${(activeCat===cat.n||(activeCat===null&&cat.n==='الكل'))?'active':''}"
                             onclick="filterCat('${cat.n}')">
                        <i class="${cat.i}"></i><span>${cat.n}</span>
                    </div>`
                ).join('');
                const sel = document.getElementById('adCat');
                if (sel) {
                    sel.innerHTML = '<option value="">اختر الفئة...</option>' +
                        CATS.filter(c => c.n !== 'الكل').map(c =>
                            `<option value="${c.n}">${c.n}</option>`).join('');
                }
            }
            window.filterCat = function(name) {
                activeCat = name === 'الكل' ? null : name;
                renderCats();
                applyFilter();
            };
            renderCats();

            /* ===== SORT ===== */
            window.toggleSort = function() {
                const modes = ['newest', 'price_asc', 'price_desc'];
                const labels = ['الأحدث', 'السعر ↑', 'السعر ↓'];
                const idx = (modes.indexOf(sortMode) + 1) % modes.length;
                sortMode = modes[idx];
                document.getElementById('sortLabel').textContent = labels[idx];
                applyFilter();
            };

            /* ===== LOAD ADS ===== */
            function loadAds() {
                const g = document.getElementById('adsGrid');
                g.innerHTML =
                    '<div class="loading"><i class="fas fa-spinner fa-spin"></i><p>جاري التحميل...</p></div>';
                db.collection('ads')
                    .orderBy('createdAt', 'desc')
                    .get()
                    .then(snap => {
                        allAds = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        applyFilter();
                        renderPremiumBanner();
                    })
                    .catch(() => {
                        g.innerHTML =
                            '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>تعذّر تحميل الإعلانات</p></div>';
                    });
            }

            function applyFilter() {
                const q = document.getElementById('searchInput').value.trim().toLowerCase();
                let list = [...allAds];

                // category
                if (activeCat) list = list.filter(a => a.category === activeCat);

                // search
                if (q) {
                    list = list.filter(a =>
                        (a.title || '').toLowerCase().includes(q) ||
                        (a.description || '').toLowerCase().includes(q)
                    );
                }

                // sort
                if (sortMode === 'price_asc') list.sort((a, b) => (a.price || 0) - (b.price || 0));
                else if (sortMode === 'price_desc') list.sort((a, b) => (b.price || 0) - (a.price || 0));
                // else newest is default (already sorted by createdAt desc)

                renderAds(list);
            }

            document.getElementById('searchInput').addEventListener('input', applyFilter);

            function renderAds(list) {
                const g = document.getElementById('adsGrid');
                document.getElementById('adsCount').textContent = list.length + ' إعلان';

                if (!list.length) {
                    g.innerHTML =
                        '<div class="empty-state"><i class="fas fa-search"></i><p>لا توجد نتائج</p></div>';
                    return;
                }

                g.innerHTML = list.map(ad => {
                    const isFav = favorites.includes(ad.id);
                    const owner = isOwner(ad);
                    return `
                            <div class="ad-card ${ad.isPremium?'premium':''}" onclick="openDetail('${ad.id}')">
                                <div class="ad-img-wrap">
                                    ${ad.imageUrl
                                        ?`<img class="ad-img" src="${ad.imageUrl}" alt="${ad.title||''}" loading="lazy">`
                                        :`<div class="ad-no-img"><i class="fas fa-image"></i></div>`
                                    }
                                    <button class="ad-fav ${isFav?'active':''}" onclick="event.stopPropagation();toggleFav('${ad.id}')">
                                        <i class="fas fa-heart"></i>
                                    </button>
                                    ${ad.category?`<span class="ad-badge">${ad.category}</span>`:''}
                                </div>
                                <div class="ad-body">
                                    <div class="ad-price">${ad.price?Number(ad.price).toLocaleString()+' $':'مجاني'}</div>
                                    <div class="ad-title">${ad.title||''}</div>
                                    <div class="ad-loc"><i class="fas fa-map-marker-alt"></i> دير الزور</div>
                                    <div class="ad-time">${timeAgo(ad.createdAt)}</div>
                                    ${owner?`
                                        <div class="ad-actions">
                                            <button class="edit-btn" onclick="event.stopPropagation();editAd('${ad.id}')" title="تعديل"><i class="fas fa-edit"></i></button>
                                            <button class="del-btn" onclick="event.stopPropagation();deleteAd('${ad.id}')" title="حذف"><i class="fas fa-trash"></i></button>
                                        </div>
                                    `:''}
                                </div>
                            </div>
                        `;
                }).join('');
            }

            /* ===== PREMIUM BANNER ===== */
            function renderPremiumBanner() {
                const premium = allAds.filter(a => a.isPremium === true);
                const banner = document.getElementById('premiumBanner');
                const slide = document.getElementById('premiumSlide');
                if (!premium.length) {
                    banner.style.display = 'none';
                    return;
                }
                banner.style.display = 'flex';
                slide.innerHTML = premium.map(ad => `
                        <div class="premium-item" onclick="openDetail('${ad.id}')">
                            ${ad.imageUrl ? `<img src="${ad.imageUrl}" alt="${ad.title}">` : `<div style="width:36px;height:36px;border-radius:8px;background:#e0e4ef;display:flex;align-items:center;justify-content:center;color:#aab;"><i class="fas fa-image"></i></div>`}
                            <div class="info">
                                <div class="p-title">${ad.title||''}</div>
                                <div class="p-price">${ad.price?Number(ad.price).toLocaleString()+' $':'مجاني'}</div>
                            </div>
                        </div>
                    `).join('');
            }

            /* ===== FAVORITES ===== */
            window.toggleFav = function(id) {
                const idx = favorites.indexOf(id);
                if (idx > -1) {
                    favorites.splice(idx, 1);
                    showToast('❌ حذف من المفضلة');
                } else {
                    favorites.push(id);
                    showToast('❤️ أضيف للمفضلة');
                }
                localStorage.setItem('favorites', JSON.stringify(favorites));
                applyFilter();
            };

            window.showFavorites = function() {
                const favList = allAds.filter(a => favorites.includes(a.id));
                if (!favList.length) {
                    showToast('لا توجد إعلانات مفضلة', 'bad');
                    return;
                }
                const g = document.getElementById('adsGrid');
                document.getElementById('adsCount').textContent = favList.length + ' مفضلة';
                g.innerHTML = favList.map(ad => `
                        <div class="ad-card" onclick="openDetail('${ad.id}')">
                            <div class="ad-img-wrap">
                                ${ad.imageUrl
                                    ?`<img class="ad-img" src="${ad.imageUrl}" alt="${ad.title||''}" loading="lazy">`
                                    :`<div class="ad-no-img"><i class="fas fa-image"></i></div>`
                                }
                                <button class="ad-fav active" onclick="event.stopPropagation();toggleFav('${ad.id}')">
                                    <i class="fas fa-heart"></i>
                                </button>
                                ${ad.category?`<span class="ad-badge">${ad.category}</span>`:''}
                            </div>
                            <div class="ad-body">
                                <div class="ad-price">${ad.price?Number(ad.price).toLocaleString()+' $':'مجاني'}</div>
                                <div class="ad-title">${ad.title||''}</div>
                                <div class="ad-loc"><i class="fas fa-map-marker-alt"></i> دير الزور</div>
                                <div class="ad-time">${timeAgo(ad.createdAt)}</div>
                            </div>
                        </div>
                    `).join('');
                // reset filter bar count style
                document.querySelector('.filter-bar .count').textContent = favList.length + ' مفضلة';
            };

            /* ===== DETAIL ===== */
            window.openDetail = function(id) {
                const ad = allAds.find(a => a.id === id);
                if (!ad) return;
                const owner = isOwner(ad);
                document.getElementById('detailContent').innerHTML = `
                        ${ad.imageUrl?`<img class="detail-img" src="${ad.imageUrl}" alt="${ad.title}">`:''}
                        <span style="background:#e3f2fd;color:var(--blue);padding:3px 10px;border-radius:20px;font-size:.8em;font-weight:700">${ad.category||''}</span>
                        ${ad.isPremium?'<span style="background:var(--orange);color:#fff;padding:3px 10px;border-radius:20px;font-size:.8em;font-weight:700;margin-right:6px;">⭐ مميز</span>':''}
                        <h3 style="font-size:1.1em;font-weight:800;margin:10px 0 4px">${ad.title||''}</h3>
                        <div class="detail-price">${ad.price?Number(ad.price).toLocaleString()+' $':'مجاني'}</div>
                        <p class="detail-desc">${ad.description||''}</p>
                        <div class="detail-info">
                            ${ad.phone?`<div class="detail-info-row"><i class="fas fa-phone"></i><span>${ad.phone}</span></div>`:''}
                            <div class="detail-info-row"><i class="fas fa-map-marker-alt"></i><span>دير الزور، سوريا</span></div>
                            <div class="detail-info-row"><i class="fas fa-clock"></i><span>${timeAgo(ad.createdAt)}</span></div>
                            ${ad.userEmail?`<div class="detail-info-row"><i class="fas fa-user"></i><span>${ad.userEmail}</span></div>`:''}
                        </div>
                        ${ad.phone?`<a href="tel:${ad.phone}" class="call-btn"><i class="fas fa-phone-alt"></i> اتصل بالبائع (${ad.phone})</a>`:''}
                        ${currentUser && !owner ? `<button class="btn-full btn-blue" style="margin-top:10px;" onclick="openChatWith('${ad.userId}','${ad.title}')"><i class="fas fa-comment"></i> مراسلة البائع</button>`:''}
                        ${owner ? `
                            <div style="display:flex;gap:8px;margin-top:12px;">
                                <button class="btn-full btn-blue" onclick="editAd('${ad.id}')"><i class="fas fa-edit"></i> تعديل</button>
                                <button class="btn-full btn-danger" onclick="deleteAd('${ad.id}')"><i class="fas fa-trash"></i> حذف</button>
                            </div>
                        `:''}
                    `;
                document.getElementById('detailModal').classList.add('active');
            };
            document.getElementById('closeDetail').onclick = () => document.getElementById('detailModal').classList.remove(
            'active');

            /* ===== EDIT AD ===== */
            window.editAd = function(id) {
                const ad = allAds.find(a => a.id === id);
                if (!ad || !isOwner(ad)) {
                    showToast('لا تملك صلاحية تعديل هذا الإعلان', 'bad');
                    return;
                }
                document.getElementById('editAdId').value = id;
                document.getElementById('addModalTitle').textContent = '✏️ تعديل الإعلان';
                document.getElementById('adTitle').value = ad.title || '';
                document.getElementById('adDesc').value = ad.description || '';
                document.getElementById('adPrice').value = ad.price || '';
                document.getElementById('adPhone').value = ad.phone || '';
                document.getElementById('adCat').value = ad.category || '';
                document.getElementById('adPremium').checked = ad.isPremium || false;
                document.getElementById('imgPreview').innerHTML = ad.imageUrl ?
                    `<img src="${ad.imageUrl}" style="max-height:150px;">` : '';
                document.getElementById('addSubmit').innerHTML = '<i class="fas fa-save"></i> تحديث الإعلان';
                document.getElementById('addModal').classList.add('active');
                document.getElementById('detailModal').classList.remove('active');
            };

            /* ===== DELETE AD ===== */
            window.deleteAd = function(id) {
                const ad = allAds.find(a => a.id === id);
                if (!ad || !isOwner(ad)) {
                    showToast('لا تملك صلاحية حذف هذا الإعلان', 'bad');
                    return;
                }
                if (!confirm('هل أنت متأكد من حذف هذا الإعلان؟')) return;
                db.collection('ads').doc(id).delete()
                    .then(() => {
                        // delete image from storage if exists
                        if (ad.imageUrl) {
                            const ref = st.refFromURL(ad.imageUrl);
                            ref.delete().catch(() => {});
                        }
                        showToast('🗑️ تم حذف الإعلان', 'ok');
                        loadAds();
                        document.getElementById('detailModal').classList.remove('active');
                    })
                    .catch(() => showToast('فشل الحذف، حاول مجدداً', 'bad'));
            };

            /* ===== AUTH ===== */
            auth.onAuthStateChanged(u => {
                currentUser = u;
                updateNavBtn();
                if (u) {
                    // update user displayName if set
                    if (u.displayName) {
                        document.getElementById('authName').value = u.displayName;
                    }
                    // load chat badge
                    checkUnreadMessages();
                }
                // load ads after auth
                loadAds();
            });

            function updateNavBtn() {
                const btn = document.getElementById('loginNavBtn');
                if (currentUser) {
                    btn.innerHTML = '<i class="fas fa-sign-out-alt"></i>';
                    btn.onclick = () => {
                        if (confirm('تسجيل الخروج؟')) {
                            auth.signOut();
                            showToast('تم الخروج');
                        }
                    };
                } else {
                    btn.innerHTML = '<i class="fas fa-user"></i>';
                    btn.onclick = openAuth;
                }
            }

            function openAuth() {
                document.getElementById('authModal').classList.add('active');
            }
            document.getElementById('closeAuth').onclick = () => document.getElementById('authModal').classList.remove(
            'active');

            // Toggle login/signup
            document.getElementById('toggleLink').onclick = function(e) {
                e.preventDefault();
                isSignup = !isSignup;
                document.getElementById('authTitle').textContent = isSignup ? 'إنشاء حساب' : 'تسجيل الدخول';
                document.getElementById('authSubmit').textContent = isSignup ? 'إنشاء الحساب' : 'دخول';
                document.getElementById('nameRow').style.display = isSignup ? 'block' : 'none';
                document.getElementById('toggleText').textContent = isSignup ? 'لديك حساب؟' : 'ليس لديك حساب؟';
                this.textContent = isSignup ? ' دخول' : ' إنشاء حساب';
                document.getElementById('authErr').className = 'err';
            };

            // Forgot password
            document.getElementById('forgotPassLink').onclick = function(e) {
                e.preventDefault();
                document.getElementById('authModal').classList.remove('active');
                document.getElementById('forgotModal').classList.add('active');
                document.getElementById('forgotEmail').value = document.getElementById('authEmail').value || '';
            };
            document.getElementById('closeForgot').onclick = () => document.getElementById('forgotModal').classList.remove(
                'active');

            document.getElementById('forgotForm').onsubmit = function(e) {
                e.preventDefault();
                const email = document.getElementById('forgotEmail').value;
                const btn = this.querySelector('button[type="submit"]');
                const err = document.getElementById('forgotErr');
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...';
                err.className = 'err';
                auth.sendPasswordResetEmail(email)
                    .then(() => {
                        showToast('📧 تم إرسال رابط استعادة كلمة المرور إلى بريدك', 'ok');
                        document.getElementById('forgotModal').classList.remove('active');
                        document.getElementById('authModal').classList.add('active');
                    })
                    .catch(ex => {
                        const m = {
                            'auth/user-not-found': 'البريد غير مسجل',
                            'auth/invalid-email': 'بريد إلكتروني غير صحيح'
                        };
                        err.textContent = m[ex.code] || 'حدث خطأ، حاول مجدداً';
                        err.className = 'err show';
                    })
                    .finally(() => {
                        btn.disabled = false;
                        btn.textContent = 'إرسال رابط الاستعادة';
                    });
            };

            // Auth submit
            document.getElementById('authForm').onsubmit = function(e) {
                e.preventDefault();
                const email = document.getElementById('authEmail').value;
                const pass = document.getElementById('authPass').value;
                const name = document.getElementById('authName').value.trim();
                const btn = document.getElementById('authSubmit');
                const err = document.getElementById('authErr');
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                err.className = 'err';

                const p = isSignup ?
                    auth.createUserWithEmailAndPassword(email, pass) :
                    auth.signInWithEmailAndPassword(email, pass);

                p.then(res => {
                    if (isSignup && name && res.user) {
                        res.user.updateProfile({ displayName: name })
                            .then(() => {
                                // save to firestore
                                db.collection('users').doc(res.user.uid).set({
                                    name: name,
                                    email: email,
                                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                                }).catch(() => {});
                            })
                            .catch(() => {});
                    }
                    document.getElementById('authModal').classList.remove('active');
                    showToast(isSignup ? '🎉 مرحباً! تم إنشاء حسابك' : '👋 أهلاً بعودتك', 'ok');
                }).catch(ex => {
                    const m = {
                        'auth/user-not-found': 'البريد غير مسجل',
                        'auth/wrong-password': 'كلمة المرور خاطئة',
                        'auth/email-already-in-use': 'البريد مسجل مسبقاً',
                        'auth/weak-password': 'كلمة المرور ضعيفة جداً',
                        'auth/invalid-email': 'بريد إلكتروني غير صحيح'
                    };
                    err.textContent = m[ex.code] || 'حدث خطأ، حاول مجدداً';
                    err.className = 'err show';
                }).finally(() => {
                    btn.disabled = false;
                    btn.textContent = isSignup ? 'إنشاء الحساب' : 'دخول';
                });
            };

            /* ===== ADD / EDIT AD ===== */
            document.getElementById('fabAdd').onclick = function() {
                if (!currentUser) { openAuth();
                    showToast('سجل دخولك أولاً', 'bad'); return; }
                // reset form for new ad
                document.getElementById('editAdId').value = '';
                document.getElementById('addModalTitle').textContent = '📝 نشر إعلان جديد';
                document.getElementById('addForm').reset();
                document.getElementById('imgPreview').innerHTML = '';
                document.getElementById('addSubmit').innerHTML = '<i class="fas fa-paper-plane"></i> نشر الإعلان';
                document.getElementById('adPremium').checked = false;
                document.getElementById('addModal').classList.add('active');
            };
            document.getElementById('closeAdd').onclick = () => document.getElementById('addModal').classList.remove('active');

            document.getElementById('adImg').onchange = function() {
                const f = this.files[0];
                if (!f) return;
                const r = new FileReader();
                r.onload = e => document.getElementById('imgPreview').innerHTML =
                    `<img src="${e.target.result}" style="max-height:200px;">`;
                r.readAsDataURL(f);
            };

            document.getElementById('addForm').onsubmit = async function(e) {
                e.preventDefault();
                if (!currentUser) { showToast('سجل دخولك أولاً', 'bad'); return; }

                const btn = document.getElementById('addSubmit');
                const err = document.getElementById('addErr');
                const editId = document.getElementById('editAdId').value;
                const isEdit = !!editId;

                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + (isEdit ? 'جاري التحديث...' : 'جاري النشر...');
                err.className = 'err';

                try {
                    let imgUrl = null;
                    const f = document.getElementById('adImg').files[0];
                    const existingAd = isEdit ? allAds.find(a => a.id === editId) : null;

                    // if there's a new image, upload it
                    if (f) {
                        const ref = st.ref('ads/' + Date.now() + '_' + f.name);
                        await ref.put(f);
                        imgUrl = await ref.getDownloadURL();
                    } else if (isEdit && existingAd && existingAd.imageUrl) {
                        imgUrl = existingAd.imageUrl;
                    }

                    const data = {
                        title: document.getElementById('adTitle').value,
                        description: document.getElementById('adDesc').value,
                        price: parseFloat(document.getElementById('adPrice').value) || 0,
                        phone: document.getElementById('adPhone').value,
                        category: document.getElementById('adCat').value,
                        isPremium: document.getElementById('adPremium').checked,
                        userId: currentUser.uid,
                        userEmail: currentUser.email,
                        imageUrl: imgUrl,
                    };

                    if (!isEdit) {
                        data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                        await db.collection('ads').add(data);
                        showToast('🎉 تم نشر إعلانك بنجاح!', 'ok');
                    } else {
                        data.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
                        await db.collection('ads').doc(editId).update(data);
                        showToast('✅ تم تحديث الإعلان', 'ok');
                    }

                    document.getElementById('addModal').classList.remove('active');
                    document.getElementById('addForm').reset();
                    document.getElementById('imgPreview').innerHTML = '';
                    loadAds();

                } catch (ex) {
                    console.error(ex);
                    err.textContent = 'حدث خطأ، حاول مجدداً';
                    err.className = 'err show';
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = isEdit ? '<i class="fas fa-save"></i> تحديث الإعلان' :
                        '<i class="fas fa-paper-plane"></i> نشر الإعلان';
                }
            };

            /* ===== CHAT SYSTEM ===== */
            let chatListeners = {};

            function checkUnreadMessages() {
                if (!currentUser) {
                    document.getElementById('chatBadgeDot').style.display = 'none';
                    return;
                }
                db.collection('chats')
                    .where('participants', 'array-contains', currentUser.uid)
                    .where('unreadFor', 'array-contains', currentUser.uid)
                    .get()
                    .then(snap => {
                        const hasUnread = snap.size > 0;
                        document.getElementById('chatBadgeDot').style.display = hasUnread ? 'block' : 'none';
                    })
                    .catch(() => {});
            }

            window.openChatDashboard = function() {
                if (!currentUser) { openAuth();
                    showToast('سجل دخولك أولاً', 'bad'); return; }
                document.getElementById('chatModal').classList.add('active');
                loadChatList();
            };
            document.getElementById('closeChat').onclick = function() {
                document.getElementById('chatModal').classList.remove('active');
                if (chatUnsubscribe) { chatUnsubscribe();
                    chatUnsubscribe = null; }
            };

            function loadChatList() {
                const list = document.getElementById('chatUserList');
                list.innerHTML = '<p style="color:var(--gray);text-align:center;padding:20px;"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</p>';
                document.getElementById('chatRoom').style.display = 'none';

                db.collection('chats')
                    .where('participants', 'array-contains', currentUser.uid)
                    .orderBy('lastMessageTime', 'desc')
                    .get()
                    .then(snap => {
                        if (snap.empty) {
                            list.innerHTML =
                                '<p style="color:var(--gray);text-align:center;padding:20px;">📭 لا توجد محادثات بعد</p>';
                            return;
                        }

                        const chatData = [];
                        snap.forEach(doc => {
                            const data = doc.data();
                            const otherId = data.participants.find(p => p !== currentUser.uid);
                            chatData.push({ id: doc.id, ...data, otherId });
                        });

                        // Fetch user names
                        const promises = chatData.map(c =>
                            db.collection('users').doc(c.otherId).get()
                            .then(doc => {
                                c.otherName = doc.exists ? (doc.data().name || c.otherId) : c.otherId;
                                return c;
                            })
                            .catch(() => {
                                c.otherName = c.otherId;
                                return c;
                            })
                        );

                        Promise.all(promises).then(results => {
                            list.innerHTML = results.map(c => `
                                    <div class="chat-user-item" onclick="openChatWith('${c.otherId}','${c.otherName}')">
                                        <div class="avatar">${getInitials(c.otherName)}</div>
                                        <div style="flex:1;min-width:0;">
                                            <div class="uname">${c.otherName}</div>
                                            <div class="last-msg">${c.lastMessage || '...'}</div>
                                        </div>
                                        ${c.unreadFor && c.unreadFor.includes(currentUser.uid) ? '<span style="background:#ef5350;color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:.7em;font-weight:700;">!</span>' : ''}
                                    </div>
                                `).join('');
                        });

                    })
                    .catch(() => {
                        list.innerHTML = '<p style="color:var(--gray);text-align:center;padding:20px;">⚠️ تعذّر تحميل المحادثات</p>';
                    });
            }

            window.openChatWith = function(userId, userName) {
                if (!currentUser) { openAuth();
                    showToast('سجل دخولك أولاً', 'bad'); return; }
                if (userId === currentUser.uid) {
                    showToast('لا يمكنك مراسلة نفسك', 'bad');
                    return;
                }

                currentChatUserId = userId;
                document.getElementById('chatRoomTitle').textContent = userName || 'محادثة';
                document.getElementById('chatUserList').style.display = 'none';
                document.getElementById('chatRoom').style.display = 'block';
                document.getElementById('chatInput').value = '';
                document.getElementById('chatMessages').innerHTML =
                    '<p style="text-align:center;color:var(--gray);padding:20px;"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</p>';

                // Find or create chat room
                db.collection('chats')
                    .where('participants', 'array-contains', currentUser.uid)
                    .get()
                    .then(snap => {
                        let chatId = null;
                        snap.forEach(doc => {
                            const data = doc.data();
                            if (data.participants && data.participants.includes(userId)) {
                                chatId = doc.id;
                            }
                        });

                        if (chatId) {
                            listenToChat(chatId);
                        } else {
                            // Create new chat
                            db.collection('chats').add({
                                participants: [currentUser.uid, userId],
                                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                                lastMessage: '',
                                lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(),
                                unreadFor: []
                            }).then(docRef => {
                                listenToChat(docRef.id);
                            }).catch(() => {
                                showToast('فشل إنشاء المحادثة', 'bad');
                            });
                        }
                    })
                    .catch(() => showToast('حدث خطأ', 'bad'));

                // Also close detail modal if open
                document.getElementById('detailModal').classList.remove('active');
                // Show chat modal
                document.getElementById('chatModal').classList.add('active');
            };

            function listenToChat(chatId) {
                if (chatUnsubscribe) { chatUnsubscribe(); }
                const msgsDiv = document.getElementById('chatMessages');

                // Mark as read
                db.collection('chats').doc(chatId).update({
                    unreadFor: firebase.firestore.FieldValue.arrayRemove(currentUser.uid)
                }).catch(() => {});

                chatUnsubscribe = db.collection('chats').doc(chatId)
                    .onSnapshot(doc => {
                        if (!doc.exists) return;
                        const data = doc.data();

                        // Load messages
                        db.collection('chats')
                            .doc(chatId)
                            .collection('messages')
                            .orderBy('timestamp', 'asc')
                            .onSnapshot(snap => {
                                if (snap.empty) {
                                    msgsDiv.innerHTML =
                                        '<p style="text-align:center;color:var(--gray);padding:20px;">💬 لا توجد رسائل بعد</p>';
                                    return;
                                }
                                msgsDiv.innerHTML = snap.docs.map(d => {
                                    const m = d.data();
                                    const isMe = m.senderId === currentUser.uid;
                                    return `
                                            <div class="chat-msg ${isMe?'me':'other'}">
                                                ${m.text}
                                                <span class="meta">${timeAgo(m.timestamp)}</span>
                                            </div>
                                        `;
                                }).join('');
                                msgsDiv.scrollTop = msgsDiv.scrollHeight;

                                // Mark as read if not me
                                if (data.lastSenderId !== currentUser.uid) {
                                    db.collection('chats').doc(chatId).update({
                                        unreadFor: firebase.firestore.FieldValue.arrayRemove(
                                            currentUser.uid)
                                    }).catch(() => {});
                                }
                            });
                    }, err => {
                        console.error(err);
                        msgsDiv.innerHTML =
                            '<p style="text-align:center;color:var(--gray);padding:20px;">⚠️ تعذّر الاتصال</p>';
                    });

                // Update unread badge
                checkUnreadMessages();
            }

            window.sendChatMessage = function() {
                const input = document.getElementById('chatInput');
                const text = input.value.trim();
                if (!text || !currentChatUserId) return;

                // Find chat id
                db.collection('chats')
                    .where('participants', 'array-contains', currentUser.uid)
                    .get()
                    .then(snap => {
                        let chatId = null;
                        snap.forEach(doc => {
                            const data = doc.data();
                            if (data.participants && data.participants.includes(currentChatUserId)) {
                                chatId = doc.id;
                            }
                        });
                        if (!chatId) {
                            showToast('حدث خطأ في المحادثة', 'bad');
                            return;
                        }

                        const msgData = {
                            text: text,
                            senderId: currentUser.uid,
                            senderName: currentUser.displayName || currentUser.email || 'مستخدم',
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        };

                        db.collection('chats').doc(chatId).collection('messages').add(msgData);

                        // Update chat metadata
                        db.collection('chats').doc(chatId).update({
                            lastMessage: text,
                            lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(),
                            lastSenderId: currentUser.uid,
                            unreadFor: firebase.firestore.FieldValue.arrayUnion(currentChatUserId)
                        }).catch(() => {});

                        input.value = '';
                        checkUnreadMessages();
                    })
                    .catch(() => showToast('حدث خطأ', 'bad'));
            };

            window.backToChatList = function() {
                if (chatUnsubscribe) { chatUnsubscribe();
                    chatUnsubscribe = null; }
                document.getElementById('chatRoom').style.display = 'none';
                document.getElementById('chatUserList').style.display = 'block';
                loadChatList();
            };

            // Close chat modal on backdrop click
            document.getElementById('chatModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('active');
                    if (chatUnsubscribe) { chatUnsubscribe();
                        chatUnsubscribe = null; }
                }
            });

            /* ===== TAB ===== */
            window.setTab = function(el, tab) {
                document.querySelectorAll('.bnav-item').forEach(b => b.classList.remove('active'));
                el.classList.add('active');
                // if chat tab, open chat
                if (tab === 'chat') {
                    openChatDashboard();
                }
                // if home tab, reload ads
                if (tab === 'home') {
                    loadAds();
                }
            };

            /* ===== CLOSE MODALS ON BACKDROP ===== */
            document.querySelectorAll('.modal').forEach(m => {
                m.addEventListener('click', function(e) {
                    if (e.target === this) {
                        this.classList.remove('active');
                        if (this.id === 'chatModal' && chatUnsubscribe) {
                            chatUnsubscribe();
                            chatUnsubscribe = null;
                        }
                    }
                });
            });

            /* ===== INIT ===== */
            // load favorites from localStorage
            try {
                favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
            } catch { favorites = []; }

            // start
            renderCats();

            // expose for inline onclick
            window.filterCat = window.filterCat || function() {};
            window.openDetail = window.openDetail || function() {};
            window.toggleFav = window.toggleFav || function() {};
            window.editAd = window.editAd || function() {};
            window.deleteAd = window.deleteAd || function() {};
            window.openChatWith = window.openChatWith || function() {};
            window.showFavorites = window.showFavorites || function() {};
            window.setTab = window.setTab || function() {};
            window.toggleSort = window.toggleSort || function() {};
            window.sendChatMessage = window.sendChatMessage || function() {};

            console.log('🚀 سوق دير الزور - يعمل بكامل طاقته!');
            console.log('📌 الميزات: تسجيل دخول، إضافة/تعديل/حذف إعلانات، مراسلة، مفضلة، إعلانات مميزة');

        })();
    </script>

</body>
</html>
