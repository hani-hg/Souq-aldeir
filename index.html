<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سوق دير الزور</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
    <style>
        /* ===== جميع الأنماط موجودة في الكود السابق، تم حذفها للاختصار ===== */
        /* ... (نفس الأنماط السابقة) ... */
    </style>
</head>
<body>
    <!-- ===== جميع العناصر موجودة في الكود السابق ===== -->
    <!-- ... (نفس الهيكل السابق) ... -->

    <!-- ===== FIREBASE ===== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-app.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-auth.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-firestore.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-storage.min.js">
    </script>

    <script>
        (function() {
            'use strict';

            // ===== FIREBASE CONFIG =====
            firebase.initializeApp({
                apiKey: "AIzaSyCTRpzhyBsf-h9rh2AO6OuIAy_kE7k7fpY",
                authDomain: "souq-aldeir-8b708.firebaseapp.com",
                projectId: "souq-aldeir-8b708",
                storageBucket: "souq-aldeir-8b708.firebasestorage.app",
                messagingSenderId: "718751448398",
                appId: "1:718751448398:web:b588ab6753d1fc7aa1321f"
            });

            const auth = firebase.auth();
            const db = firebase.firestore();
            const storage = firebase.storage();

            // ===== STATE =====
            let currentUser = null;
            let allAds = [];
            let activeCategory = null;
            let isSignup = false;
            let sortMode = 'newest';
            let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
            let currentChatUserId = null;
            let chatUnsubscribe = null;

            // ===== TOAST =====
            window.showToast = function(msg, type = '') {
                const t = document.getElementById('toast');
                t.textContent = msg;
                t.className = 'toast ' + type + ' show';
                clearTimeout(t._timer);
                t._timer = setTimeout(() => t.className = 'toast', 2800);
            };

            // ===== HELPERS =====
            function timeAgo(ts) {
                if (!ts) return '';
                const d = ts.toDate ? ts.toDate() : new Date(ts);
                const s = Math.floor((Date.now() - d) / 1000);
                if (s < 60) return 'الآن';
                if (s < 3600) return Math.floor(s / 60) + ' دقيقة';
                if (s < 86400) return Math.floor(s / 3600) + ' ساعة';
                if (s < 604800) return Math.floor(s / 86400) + ' يوم';
                return d.toLocaleDateString('ar');
            }

            function getInitials(name) {
                if (!name) return '👤';
                const parts = name.split(' ');
                if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
                return name.substring(0, 2).toUpperCase();
            }

            function isOwner(ad) {
                return currentUser && ad.userId === currentUser.uid;
            }

            // ===== CATEGORIES =====
            const CATS = [
                { n: 'الكل', i: 'fas fa-th-large' },
                { n: 'سيارات', i: 'fas fa-car' },
                { n: 'عقارات', i: 'fas fa-home' },
                { n: 'إلكترونيات', i: 'fas fa-mobile-alt' },
                { n: 'ملابس', i: 'fas fa-tshirt' },
                { n: 'أثاث', i: 'fas fa-couch' },
                { n: 'وظائف', i: 'fas fa-briefcase' },
                { n: 'خدمات', i: 'fas fa-tools' },
                { n: 'حيوانات', i: 'fas fa-paw' },
                { n: 'رياضة', i: 'fas fa-futbol' },
                { n: 'أخرى', i: 'fas fa-box' },
            ];

            function renderCats() {
                const c = document.getElementById('catsScroll');
                c.innerHTML = CATS.map(cat =>
                    `<div class="cat-chip ${(activeCategory===cat.n||(activeCategory===null&&cat.n==='الكل'))?'active':''}"
                             onclick="filterCat('${cat.n}')">
                        <i class="${cat.i}"></i><span>${cat.n}</span>
                    </div>`
                ).join('');
                const sel = document.getElementById('adCat');
                if (sel) {
                    sel.innerHTML = '<option value="">اختر الفئة...</option>' +
                        CATS.filter(c => c.n !== 'الكل').map(c =>
                            `<option value="${c.n}">${c.n}</option>`).join('');
                }
            }
            window.filterCat = function(name) {
                activeCategory = name === 'الكل' ? null : name;
                renderCats();
                applyFilter();
            };
            renderCats();

            // ===== SORT =====
            window.toggleSort = function() {
                const modes = ['newest', 'price_asc', 'price_desc'];
                const labels = ['الأحدث', 'السعر ↑', 'السعر ↓'];
                const idx = (modes.indexOf(sortMode) + 1) % modes.length;
                sortMode = modes[idx];
                document.getElementById('sortLabel').textContent = labels[idx];
                applyFilter();
            };

            // ===== LOAD ADS =====
            function loadAds() {
                const g = document.getElementById('adsGrid');
                g.innerHTML =
                    '<div class="loading"><i class="fas fa-spinner fa-spin"></i><p>جاري التحميل...</p></div>';

                db.collection('ads')
                    .get()
                    .then(snapshot => {
                        if (snapshot.empty) {
                            allAds = [];
                            renderAds([]);
                            return;
                        }
                        allAds = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        allAds.sort((a, b) => {
                            const ta = a.createdAt ? a.createdAt.toDate() : new Date(0);
                            const tb = b.createdAt ? b.createdAt.toDate() : new Date(0);
                            return tb - ta;
                        });
                        applyFilter();
                        renderPremiumBanner();
                    })
                    .catch(error => {
                        console.error('Firestore error:', error);
                        // إذا كان الخطأ بسبب MFA، نعرض رسالة واضحة
                        if (error.code === 'permission-denied' || error.message.includes('multi-factor')) {
                            g.innerHTML = `
                                <div class="empty-state">
                                    <i class="fas fa-shield-alt"></i>
                                    <p>⚠️ يتطلب Firebase تفعيل المصادقة متعددة العوامل (MFA).</p>
                                    <p style="font-size:.85em;margin-top:8px;color:var(--gray);">
                                        يرجى تفعيلها من <a href="https://console.cloud.google.com/" target="_blank" style="color:var(--blue);font-weight:700;">Google Cloud Console</a>
                                        أو استخدم حساب خدمة (Service Account).
                                    </p>
                                </div>
                            `;
                        } else {
                            g.innerHTML =
                                `<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>تعذّر تحميل الإعلانات: ${error.message}</p></div>`;
                        }
                        showToast('⚠️ فشل تحميل الإعلانات', 'bad');
                    });
            }

            function applyFilter() {
                const q = document.getElementById('searchInput').value.trim().toLowerCase();
                let list = [...allAds];
                if (activeCategory) list = list.filter(a => a.category === activeCategory);
                if (q) list = list.filter(a =>
                    (a.title || '').toLowerCase().includes(q) ||
                    (a.description || '').toLowerCase().includes(q)
                );
                if (sortMode === 'price_asc') list.sort((a, b) => (a.price || 0) - (b.price || 0));
                else if (sortMode === 'price_desc') list.sort((a, b) => (b.price || 0) - (a.price || 0));
                renderAds(list);
            }

            document.getElementById('searchInput').addEventListener('input', applyFilter);

            function renderAds(list) {
                const g = document.getElementById('adsGrid');
                document.getElementById('adsCount').textContent = list.length + ' إعلان';
                if (!list.length) {
                    g.innerHTML =
                        '<div class="empty-state"><i class="fas fa-search"></i><p>لا توجد نتائج</p></div>';
                    return;
                }
                g.innerHTML = list.map(ad => {
                    const isFav = favorites.includes(ad.id);
                    const owner = isOwner(ad);
                    return `
                        <div class="ad-card ${ad.isPremium?'premium':''}" onclick="openDetail('${ad.id}')">
                            <div class="ad-img-wrap">
                                ${ad.imageUrl
                                    ?`<img class="ad-img" src="${ad.imageUrl}" alt="${ad.title||''}" loading="lazy">`
                                    :`<div class="ad-no-img"><i class="fas fa-image"></i></div>`
                                }
                                <button class="ad-fav ${isFav?'active':''}" onclick="event.stopPropagation();toggleFav('${ad.id}')">
                                    <i class="fas fa-heart"></i>
                                </button>
                                ${ad.category?`<span class="ad-badge">${ad.category}</span>`:''}
                            </div>
                            <div class="ad-body">
                                <div class="ad-price">${ad.price?Number(ad.price).toLocaleString()+' $':'مجاني'}</div>
                                <div class="ad-title">${ad.title||''}</div>
                                <div class="ad-loc"><i class="fas fa-map-marker-alt"></i> دير الزور</div>
                                <div class="ad-time">${timeAgo(ad.createdAt)}</div>
                                ${owner?`
                                    <div class="ad-actions">
                                        <button class="edit-btn" onclick="event.stopPropagation();editAd('${ad.id}')" title="تعديل"><i class="fas fa-edit"></i></button>
                                        <button class="del-btn" onclick="event.stopPropagation();deleteAd('${ad.id}')" title="حذف"><i class="fas fa-trash"></i></button>
                                    </div>
                                `:''}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // ===== PREMIUM BANNER =====
            function renderPremiumBanner() {
                const premium = allAds.filter(a => a.isPremium === true);
                const banner = document.getElementById('premiumBanner');
                const slide = document.getElementById('premiumSlide');
                if (!premium.length) {
                    banner.style.display = 'none';
                    return;
                }
                banner.style.display = 'flex';
                slide.innerHTML = premium.map(ad => `
                    <div class="premium-item" onclick="openDetail('${ad.id}')">
                        ${ad.imageUrl ? `<img src="${ad.imageUrl}" alt="${ad.title}">` : `<div style="width:36px;height:36px;border-radius:8px;background:#e0e4ef;display:flex;align-items:center;justify-content:center;color:#aab;"><i class="fas fa-image"></i></div>`}
                        <div class="info">
                            <div class="p-title">${ad.title||''}</div>
                            <div class="p-price">${ad.price?Number(ad.price).toLocaleString()+' $':'مجاني'}</div>
                        </div>
                    </div>
                `).join('');
            }

            // ===== FAVORITES =====
            window.toggleFav = function(id) {
                const idx = favorites.indexOf(id);
                if (idx > -1) { favorites.splice(idx, 1);
                    showToast('❌ حذف من المفضلة'); } else { favorites.push(id);
                    showToast('❤️ أضيف للمفضلة'); }
                localStorage.setItem('favorites', JSON.stringify(favorites));
                applyFilter();
            };

            window.showFavorites = function() {
                const favList = allAds.filter(a => favorites.includes(a.id));
                if (!favList.length) { showToast('لا توجد إعلانات مفضلة', 'bad'); return; }
                const g = document.getElementById('adsGrid');
                document.getElementById('adsCount').textContent = favList.length + ' مفضلة';
                g.innerHTML = favList.map(ad => `
                    <div class="ad-card" onclick="openDetail('${ad.id}')">
                        <div class="ad-img-wrap">
                            ${ad.imageUrl ? `<img class="ad-img" src="${ad.imageUrl}" alt="${ad.title||''}" loading="lazy">` : `<div class="ad-no-img"><i class="fas fa-image"></i></div>`}
                            <button class="ad-fav active" onclick="event.stopPropagation();toggleFav('${ad.id}')"><i class="fas fa-heart"></i></button>
                            ${ad.category?`<span class="ad-badge">${ad.category}</span>`:''}
                        </div>
                        <div class="ad-body">
                            <div class="ad-price">${ad.price?Number(ad.price).toLocaleString()+' $':'مجاني'}</div>
                            <div class="ad-title">${ad.title||''}</div>
                            <div class="ad-loc"><i class="fas fa-map-marker-alt"></i> دير الزور</div>
                            <div class="ad-time">${timeAgo(ad.createdAt)}</div>
                        </div>
                    </div>
                `).join('');
            };

            // ===== DETAIL =====
            window.openDetail = function(id) {
                const ad = allAds.find(a => a.id === id);
                if (!ad) return;
                const owner = isOwner(ad);
                document.getElementById('detailContent').innerHTML = `
                    ${ad.imageUrl?`<img class="detail-img" src="${ad.imageUrl}" alt="${ad.title}">`:''}
                    <span style="background:#e3f2fd;color:var(--blue);padding:3px 10px;border-radius:20px;font-size:.8em;font-weight:700">${ad.category||''}</span>
                    ${ad.isPremium?'<span style="background:var(--orange);color:#fff;padding:3px 10px;border-radius:20px;font-size:.8em;font-weight:700;margin-right:6px;">⭐ مميز</span>':''}
                    <h3 style="font-size:1.1em;font-weight:800;margin:10px 0 4px">${ad.title||''}</h3>
                    <div class="detail-price">${ad.price?Number(ad.price).toLocaleString()+' $':'مجاني'}</div>
                    <p class="detail-desc">${ad.description||''}</p>
                    <div class="detail-info">
                        ${ad.phone?`<div class="detail-info-row"><i class="fas fa-phone"></i><span>${ad.phone}</span></div>`:''}
                        <div class="detail-info-row"><i class="fas fa-map-marker-alt"></i><span>دير الزور، سوريا</span></div>
                        <div class="detail-info-row"><i class="fas fa-clock"></i><span>${timeAgo(ad.createdAt)}</span></div>
                        ${ad.userEmail?`<div class="detail-info-row"><i class="fas fa-user"></i><span>${ad.userEmail}</span></div>`:''}
                    </div>
                    ${ad.phone?`<a href="tel:${ad.phone}" class="call-btn"><i class="fas fa-phone-alt"></i> اتصل بالبائع (${ad.phone})</a>`:''}
                    ${currentUser && !owner ? `<button class="btn-full btn-blue" style="margin-top:10px;" onclick="openChatWith('${ad.userId}','${ad.title}')"><i class="fas fa-comment"></i> مراسلة البائع</button>`:''}
                    ${owner ? `
                        <div style="display:flex;gap:8px;margin-top:12px;">
                            <button class="btn-full btn-blue" onclick="editAd('${ad.id}')"><i class="fas fa-edit"></i> تعديل</button>
                            <button class="btn-full btn-danger" onclick="deleteAd('${ad.id}')"><i class="fas fa-trash"></i> حذف</button>
                        </div>
                    `:''}
                `;
                document.getElementById('detailModal').classList.add('active');
            };
            document.getElementById('closeDetail').onclick = () =>
                document.getElementById('detailModal').classList.remove('active');

            // ===== EDIT AD =====
            window.editAd = function(id) {
                const ad = allAds.find(a => a.id === id);
                if (!ad || !isOwner(ad)) { showToast('لا تملك صلاحية التعديل', 'bad'); return; }
                document.getElementById('editAdId').value = id;
                document.getElementById('addModalTitle').textContent = '✏️ تعديل الإعلان';
                document.getElementById('adTitle').value = ad.title || '';
                document.getElementById('adDesc').value = ad.description || '';
                document.getElementById('adPrice').value = ad.price || '';
                document.getElementById('adPhone').value = ad.phone || '';
                document.getElementById('adCat').value = ad.category || '';
                document.getElementById('adPremium').checked = ad.isPremium || false;
                document.getElementById('imgPreview').innerHTML = ad.imageUrl ?
                    `<img src="${ad.imageUrl}" style="max-height:150px;">` : '';
                document.getElementById('addSubmit').innerHTML = '<i class="fas fa-save"></i> تحديث الإعلان';
                document.getElementById('addModal').classList.add('active');
                document.getElementById('detailModal').classList.remove('active');
            };

            // ===== DELETE AD =====
            window.deleteAd = function(id) {
                const ad = allAds.find(a => a.id === id);
                if (!ad || !isOwner(ad)) { showToast('لا تملك صلاحية الحذف', 'bad'); return; }
                if (!confirm('هل أنت متأكد من حذف هذا الإعلان؟')) return;
                db.collection('ads').doc(id).delete()
                    .then(() => {
                        if (ad.imageUrl) storage.refFromURL(ad.imageUrl).delete().catch(() => {});
                        showToast('🗑️ تم حذف الإعلان', 'ok');
                        loadAds();
                        document.getElementById('detailModal').classList.remove('active');
                    })
                    .catch((err) => {
                        if (err.code === 'permission-denied' || err.message.includes('multi-factor')) {
                            showToast('⚠️ يلزم تفعيل MFA لحذف الإعلان', 'bad');
                        } else {
                            showToast('فشل الحذف، حاول مجدداً', 'bad');
                        }
                    });
            };

            // ===== AUTH =====
            auth.onAuthStateChanged(u => {
                currentUser = u;
                updateNavBtn();
                if (u) {
                    if (u.displayName) document.getElementById('authName').value = u.displayName;
                    checkUnreadMessages();
                }
                loadAds();
            });

            function updateNavBtn() {
                const btn = document.getElementById('loginNavBtn');
                if (currentUser) {
                    btn.innerHTML = '<i class="fas fa-sign-out-alt"></i>';
                    btn.onclick = () => { if (confirm('تسجيل الخروج؟')) { auth.signOut();
                            showToast('تم الخروج'); } };
                } else {
                    btn.innerHTML = '<i class="fas fa-user"></i>';
                    btn.onclick = openAuth;
                }
            }

            function openAuth() { document.getElementById('authModal').classList.add('active'); }
            document.getElementById('closeAuth').onclick = () =>
                document.getElementById('authModal').classList.remove('active');

            document.getElementById('toggleLink').onclick = function(e) {
                e.preventDefault();
                isSignup = !isSignup;
                document.getElementById('authTitle').textContent = isSignup ? 'إنشاء حساب' : 'تسجيل الدخول';
                document.getElementById('authSubmit').textContent = isSignup ? 'إنشاء الحساب' : 'دخول';
                document.getElementById('nameRow').style.display = isSignup ? 'block' : 'none';
                document.getElementById('toggleText').textContent = isSignup ? 'لديك حساب؟' : 'ليس لديك حساب؟';
                this.textContent = isSignup ? ' دخول' : ' إنشاء حساب';
                document.getElementById('authErr').className = 'err';
            };

            document.getElementById('forgotPassLink').onclick = function(e) {
                e.preventDefault();
                document.getElementById('authModal').classList.remove('active');
                document.getElementById('forgotModal').classList.add('active');
                document.getElementById('forgotEmail').value = document.getElementById('authEmail').value || '';
            };
            document.getElementById('closeForgot').onclick = () =>
                document.getElementById('forgotModal').classList.remove('active');

            document.getElementById('forgotForm').onsubmit = function(e) {
                e.preventDefault();
                const email = document.getElementById('forgotEmail').value;
                const btn = this.querySelector('button[type="submit"]');
                const err = document.getElementById('forgotErr');
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...';
                err.className = 'err';
                auth.sendPasswordResetEmail(email)
                    .then(() => {
                        showToast('📧 تم إرسال رابط الاستعادة إلى بريدك', 'ok');
                        document.getElementById('forgotModal').classList.remove('active');
                        document.getElementById('authModal').classList.add('active');
                    })
                    .catch(ex => {
                        const m = { 'auth/user-not-found': 'البريد غير مسجل', 'auth/invalid-email': 'بريد إلكتروني غير صحيح' };
                        err.textContent = m[ex.code] || 'حدث خطأ، حاول مجدداً';
                        err.className = 'err show';
                    })
                    .finally(() => { btn.disabled = false;
                        btn.textContent = 'إرسال رابط الاستعادة'; });
            };

            document.getElementById('authForm').onsubmit = function(e) {
                e.preventDefault();
                const email = document.getElementById('authEmail').value;
                const pass = document.getElementById('authPass').value;
                const name = document.getElementById('authName').value.trim();
                const btn = document.getElementById('authSubmit');
                const err = document.getElementById('authErr');
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                err.className = 'err';
                const p = isSignup ? auth.createUserWithEmailAndPassword(email, pass) : auth.signInWithEmailAndPassword(
                    email, pass);
                p.then(res => {
                    if (isSignup && name && res.user) {
                        res.user.updateProfile({ displayName: name })
                            .then(() => db.collection('users').doc(res.user.uid).set({ name, email,
                                    createdAt: firebase.firestore.FieldValue.serverTimestamp() }))
                            .catch(() => {});
                    }
                    document.getElementById('authModal').classList.remove('active');
                    showToast(isSignup ? '🎉 مرحباً! تم إنشاء حسابك' : '👋 أهلاً بعودتك', 'ok');
                }).catch(ex => {
                    const m = { 'auth/user-not-found': 'البريد غير مسجل', 'auth/wrong-password': 'كلمة المرور خاطئة',
                        'auth/email-already-in-use': 'البريد مسجل مسبقاً', 'auth/weak-password': 'كلمة المرور ضعيفة',
                        'auth/invalid-email': 'بريد غير صحيح' };
                    err.textContent = m[ex.code] || 'حدث خطأ، حاول مجدداً';
                    err.className = 'err show';
                }).finally(() => { btn.disabled = false;
                    btn.textContent = isSignup ? 'إنشاء الحساب' : 'دخول'; });
            };

            // ===== ADD / EDIT AD =====
            document.getElementById('fabAdd').onclick = function() {
                if (!currentUser) { openAuth();
                    showToast('سجل دخولك أولاً', 'bad'); return; }
                document.getElementById('editAdId').value = '';
                document.getElementById('addModalTitle').textContent = '📝 نشر إعلان جديد';
                document.getElementById('addForm').reset();
                document.getElementById('imgPreview').innerHTML = '';
                document.getElementById('addSubmit').innerHTML = '<i class="fas fa-paper-plane"></i> نشر الإعلان';
                document.getElementById('adPremium').checked = false;
                document.getElementById('addModal').classList.add('active');
            };
            document.getElementById('closeAdd').onclick = () =>
                document.getElementById('addModal').classList.remove('active');

            document.getElementById('adImg').onchange = function() {
                const f = this.files[0];
                if (!f) return;
                const r = new FileReader();
                r.onload = e => document.getElementById('imgPreview').innerHTML =
                    `<img src="${e.target.result}" style="max-height:200px;">`;
                r.readAsDataURL(f);
            };

            document.getElementById('addForm').onsubmit = async function(e) {
                e.preventDefault();
                if (!currentUser) { showToast('سجل دخولك أولاً', 'bad'); return; }
                const btn = document.getElementById('addSubmit');
                const err = document.getElementById('addErr');
                const editId = document.getElementById('editAdId').value;
                const isEdit = !!editId;
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + (isEdit ? 'جاري التحديث...' : 'جاري النشر...');
                err.className = 'err';
                try {
                    let imgUrl = null;
                    const f = document.getElementById('adImg').files[0];
                    const existingAd = isEdit ? allAds.find(a => a.id === editId) : null;
                    if (f) {
                        const ref = storage.ref('ads/' + Date.now() + '_' + f.name);
                        await ref.put(f);
                        imgUrl = await ref.getDownloadURL();
                    } else if (isEdit && existingAd && existingAd.imageUrl) {
                        imgUrl = existingAd.imageUrl;
                    }
                    const data = {
                        title: document.getElementById('adTitle').value,
                        description: document.getElementById('adDesc').value,
                        price: parseFloat(document.getElementById('adPrice').value) || 0,
                        phone: document.getElementById('adPhone').value,
                        category: document.getElementById('adCat').value,
                        isPremium: document.getElementById('adPremium').checked,
                        userId: currentUser.uid,
                        userEmail: currentUser.email,
                        imageUrl: imgUrl,
                    };
                    if (!isEdit) {
                        data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                        await db.collection('ads').add(data);
                        showToast('🎉 تم نشر إعلانك بنجاح!', 'ok');
                    } else {
                        data.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
                        await db.collection('ads').doc(editId).update(data);
                        showToast('✅ تم تحديث الإعلان', 'ok');
                    }
                    document.getElementById('addModal').classList.remove('active');
                    document.getElementById('addForm').reset();
                    document.getElementById('imgPreview').innerHTML = '';
                    loadAds();
                } catch (ex) {
                    console.error(ex);
                    if (ex.code === 'permission-denied' || ex.message.includes('multi-factor')) {
                        err.textContent = '⚠️ يلزم تفعيل MFA (المصادقة متعددة العوامل) في Google Cloud.';
                    } else {
                        err.textContent = 'حدث خطأ، حاول مجدداً';
                    }
                    err.className = 'err show';
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = isEdit ? '<i class="fas fa-save"></i> تحديث الإعلان' :
                        '<i class="fas fa-paper-plane"></i> نشر الإعلان';
                }
            };

            // ===== CHAT SYSTEM (نفس الكود السابق مع معالجة MFA) =====
            function checkUnreadMessages() {
                if (!currentUser) { document.getElementById('chatBadgeDot').style.display = 'none'; return; }
                db.collection('chats')
                    .where('participants', 'array-contains', currentUser.uid)
                    .where('unreadFor', 'array-contains', currentUser.uid)
                    .get()
                    .then(snap => {
                        document.getElementById('chatBadgeDot').style.display = snap.size > 0 ? 'block' : 'none';
                    })
                    .catch(() => {});
            }

            window.openChatDashboard = function() {
                if (!currentUser) { openAuth();
                    showToast('سجل دخولك أولاً', 'bad'); return; }
                document.getElementById('chatModal').classList.add('active');
                loadChatList();
            };
            document.getElementById('closeChat').onclick = function() {
                document.getElementById('chatModal').classList.remove('active');
                if (chatUnsubscribe) { chatUnsubscribe();
                    chatUnsubscribe = null; }
            };

            function loadChatList() {
                const list = document.getElementById('chatUserList');
                list.innerHTML =
                    '<p style="color:var(--gray);text-align:center;padding:20px;"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</p>';
                document.getElementById('chatRoom').style.display = 'none';
                db.collection('chats')
                    .where('participants', 'array-contains', currentUser.uid)
                    .orderBy('lastMessageTime', 'desc')
                    .get()
                    .then(snap => {
                        if (snap.empty) {
                            list.innerHTML =
                                '<p style="color:var(--gray);text-align:center;padding:20px;">📭 لا توجد محادثات بعد</p>';
                            return;
                        }
                        const chatData = [];
                        snap.forEach(doc => {
                            const data = doc.data();
                            const otherId = data.participants.find(p => p !== currentUser.uid);
                            chatData.push({ id: doc.id, ...data, otherId });
                        });
                        const promises = chatData.map(c =>
                            db.collection('users').doc(c.otherId).get()
                            .then(doc => { c.otherName = doc.exists ? (doc.data().name || c.otherId) : c
                                    .otherId; return c; })
                            .catch(() => { c.otherName = c.otherId; return c; })
                        );
                        Promise.all(promises).then(results => {
                            list.innerHTML = results.map(c => `
                                    <div class="chat-user-item" onclick="openChatWith('${c.otherId}','${c.otherName}')">
                                        <div class="avatar">${getInitials(c.otherName)}</div>
                                        <div style="flex:1;min-width:0;">
                                            <div class="uname">${c.otherName}</div>
                                            <div class="last-msg">${c.lastMessage || '...'}</div>
                                        </div>
                                        ${c.unreadFor && c.unreadFor.includes(currentUser.uid) ? '<span style="background:#ef5350;color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:.7em;font-weight:700;">!</span>' : ''}
                                    </div>
                                `).join('');
                        });
                    })
                    .catch(() => {
                        list.innerHTML =
                            '<p style="color:var(--gray);text-align:center;padding:20px;">⚠️ تعذّر تحميل المحادثات</p>';
                    });
            }

            window.openChatWith = function(userId, userName) {
                if (!currentUser) { openAuth();
                    showToast('سجل دخولك أولاً', 'bad'); return; }
                if (userId === currentUser.uid) { showToast('لا يمكنك مراسلة نفسك', 'bad'); return; }
                currentChatUserId = userId;
                document.getElementById('chatRoomTitle').textContent = userName || 'محادثة';
                document.getElementById('chatUserList').style.display = 'none';
                document.getElementById('chatRoom').style.display = 'block';
                document.getElementById('chatInput').value = '';
                document.getElementById('chatMessages').innerHTML =
                    '<p style="text-align:center;color:var(--gray);padding:20px;"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</p>';
                db.collection('chats')
                    .where('participants', 'array-contains', currentUser.uid)
                    .get()
                    .then(snap => {
                        let chatId = null;
                        snap.forEach(doc => {
                            const data = doc.data();
                            if (data.participants && data.participants.includes(userId)) chatId = doc.id;
                        });
                        if (chatId) {
                            listenToChat(chatId);
                        } else {
                            db.collection('chats').add({
                                participants: [currentUser.uid, userId],
                                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                                lastMessage: '',
                                lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(),
                                unreadFor: []
                            }).then(docRef => listenToChat(docRef.id)).catch(() => showToast('فشل إنشاء المحادثة',
                                'bad'));
                        }
                    })
                    .catch(() => showToast('حدث خطأ', 'bad'));
                document.getElementById('detailModal').classList.remove('active');
                document.getElementById('chatModal').classList.add('active');
            };

            function listenToChat(chatId) {
                if (chatUnsubscribe) { chatUnsubscribe(); }
                const msgsDiv = document.getElementById('chatMessages');
                db.collection('chats').doc(chatId).update({
                    unreadFor: firebase.firestore.FieldValue.arrayRemove(currentUser.uid)
                }).catch(() => {});
                chatUnsubscribe = db.collection('chats').doc(chatId)
                    .onSnapshot(doc => {
                        if (!doc.exists) return;
                        db.collection('chats').doc(chatId).collection('messages')
                            .orderBy('timestamp', 'asc')
                            .onSnapshot(snap => {
                                if (snap.empty) {
                                    msgsDiv.innerHTML =
                                        '<p style="text-align:center;color:var(--gray);padding:20px;">💬 لا توجد رسائل بعد</p>';
                                    return;
                                }
                                msgsDiv.innerHTML = snap.docs.map(d => {
                                    const m = d.data();
                                    const isMe = m.senderId === currentUser.uid;
                                    return `
                                            <div class="chat-msg ${isMe?'me':'other'}">
                                                ${m.text}
                                                <span class="meta">${timeAgo(m.timestamp)}</span>
                                            </div>
                                        `;
                                }).join('');
                                msgsDiv.scrollTop = msgsDiv.scrollHeight;
                                if (doc.data().lastSenderId !== currentUser.uid) {
                                    db.collection('chats').doc(chatId).update({
                                        unreadFor: firebase.firestore.FieldValue.arrayRemove(
                                            currentUser.uid)
                                    }).catch(() => {});
                                }
                            });
                    }, err => {
                        console.error(err);
                        msgsDiv.innerHTML =
                            '<p style="text-align:center;color:var(--gray);padding:20px;">⚠️ تعذّر الاتصال</p>';
                    });
                checkUnreadMessages();
            }

            window.sendChatMessage = function() {
                const input = document.getElementById('chatInput');
                const text = input.value.trim();
                if (!text || !currentChatUserId) return;
                db.collection('chats')
                    .where('participants', 'array-contains', currentUser.uid)
                    .get()
                    .then(snap => {
                        let chatId = null;
                        snap.forEach(doc => {
                            const data = doc.data();
                            if (data.participants && data.participants.includes(currentChatUserId)) chatId =
                                doc.id;
                        });
                        if (!chatId) { showToast('حدث خطأ في المحادثة', 'bad'); return; }
                        const msgData = {
                            text,
                            senderId: currentUser.uid,
                            senderName: currentUser.displayName || currentUser.email || 'مستخدم',
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        };
                        db.collection('chats').doc(chatId).collection('messages').add(msgData);
                        db.collection('chats').doc(chatId).update({
                            lastMessage: text,
                            lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(),
                            lastSenderId: currentUser.uid,
                            unreadFor: firebase.firestore.FieldValue.arrayUnion(currentChatUserId)
                        }).catch(() => {});
                        input.value = '';
                        checkUnreadMessages();
                    })
                    .catch(() => showToast('حدث خطأ', 'bad'));
            };

            window.backToChatList = function() {
                if (chatUnsubscribe) { chatUnsubscribe();
                    chatUnsubscribe = null; }
                document.getElementById('chatRoom').style.display = 'none';
                document.getElementById('chatUserList').style.display = 'block';
                loadChatList();
            };

            document.getElementById('chatModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('active');
                    if (chatUnsubscribe) { chatUnsubscribe();
                        chatUnsubscribe = null; }
                }
            });

            // ===== TAB =====
            window.setTab = function(el, tab) {
                document.querySelectorAll('.bnav-item').forEach(b => b.classList.remove('active'));
                el.classList.add('active');
                if (tab === 'chat') openChatDashboard();
                if (tab === 'home') loadAds();
            };

            // ===== CLOSE MODALS ON BACKDROP =====
            document.querySelectorAll('.modal').forEach(m => {
                m.addEventListener('click', function(e) {
                    if (e.target === this) {
                        this.classList.remove('active');
                        if (this.id === 'chatModal' && chatUnsubscribe) { chatUnsubscribe();
                            chatUnsubscribe = null; }
                    }
                });
            });

            // ===== INIT =====
            try { favorites = JSON.parse(localStorage.getItem('favorites') || '[]'); } catch { favorites = []; }
            renderCats();

            // تصدير الدوال للنطاق العام
            window.filterCat = window.filterCat || function() {};
            window.openDetail = window.openDetail || function() {};
            window.toggleFav = window.toggleFav || function() {};
            window.editAd = window.editAd || function() {};
            window.deleteAd = window.deleteAd || function() {};
            window.openChatWith = window.openChatWith || function() {};
            window.showFavorites = window.showFavorites || function() {};
            window.setTab = window.setTab || function() {};
            window.toggleSort = window.toggleSort || function() {};
            window.sendChatMessage = window.sendChatMessage || function() {};

            console.log('🚀 سوق دير الزور - يعمل مع معالجة MFA');
        })();
    </script>
</body>
</html>
