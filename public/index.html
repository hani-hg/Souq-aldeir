<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>اختبار Firebase</title>
</head>
<body>
    <h2>🔍 اختبار Firebase</h2>
    <div id="result">جاري تحميل Firebase...</div>

    <!-- تحميل مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

    <script>
        const resultDiv = document.getElementById('result');

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyCTRpzhyBsf-h9rh2AO6OuIAy_kE7k7fpY",
            authDomain: "souq-aldeir-8b708.firebaseapp.com",
            projectId: "souq-aldeir-8b708",
            storageBucket: "souq-aldeir-8b708.firebasestorage.app",
            messagingSenderId: "718751448398",
            appId: "1:718751448398:web:b588ab6753d1fc7aa1321f"
        };

        try {
            // تهيئة Firebase
            firebase.initializeApp(firebaseConfig);
            resultDiv.innerHTML = '✅ تم تحميل وتهيئة Firebase بنجاح!';

            // اختبار قراءة بسيط
            firebase.firestore().collection('test').get()
                .then(() => {
                    resultDiv.innerHTML += '<br>✅ الاتصال بقاعدة البيانات ناجح.';
                })
                .catch(error => {
                    resultDiv.innerHTML += '<br>❌ خطأ في الاتصال بقاعدة البيانات: ' + error.message;
                });

        } catch (error) {
            resultDiv.innerHTML = '❌ فشل تهيئة Firebase: ' + error.message;
        }
    </script>
</body>
</html>
