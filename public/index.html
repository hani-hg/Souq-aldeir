<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>سوق دير الزور</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:#f4f5f7;
}

header{

background:white;

padding:15px 5%;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:0 2px 10px #0001;

position:sticky;

top:0;

z-index:10;

}

.logo{

font-size:28px;

font-weight:bold;

color:#0057ff;

}

.search{

display:flex;

flex:1;

margin:0 20px;

}

.search input{

flex:1;

padding:14px;

border:1px solid #ddd;

border-radius:10px;

}

.search button{

padding:14px 22px;

margin-right:10px;

background:#0057ff;

color:white;

border:none;

border-radius:10px;

cursor:pointer;

}

.publish{

background:#17b34a;

color:white;

border:none;

padding:14px 22px;

border-radius:10px;

cursor:pointer;

}

.hero{

height:300px;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

background:
linear-gradient(
135deg,
#0057ff,
#0038a8
);

color:white;

}

.hero h1{

font-size:50px;

}

.categories{

display:grid;

grid-template-columns:
repeat(
auto-fit,
minmax(160px,1fr)
);

gap:20px;

padding:40px;

}

.cat{

background:white;

padding:35px;

text-align:center;

border-radius:18px;

font-size:20px;

cursor:pointer;

}

.grid{

padding:40px;

display:grid;

grid-template-columns:
repeat(
auto-fill,
minmax(300px,1fr)
);

gap:25px;

}

.card{

background:white;

border-radius:20px;

overflow:hidden;

box-shadow:
0 5px 20px #0001;

}

.card img{

width:100%;

height:220px;

object-fit:cover;

}

.info{

padding:20px;

}

.price{

color:#16a34a;

font-size:28px;

margin-top:10px;

}

.phone{

margin-top:15px;

color:#777;

}

footer{

padding:30px;

text-align:center;

}

@media(max-width:700px){

header{

flex-direction:column;

gap:15px;

}

.search{

width:100%;

margin:0;

}

.hero h1{

font-size:32px;

}

}

</style>

</head>

<body>

<header>

<div class="logo">
🛒 سوق دير الزور
</div>

<div class="search">

<input placeholder="ابحث عن أي شيء">

<button>
بحث
</button>

</div>

<button class="publish">
+ إعلان
</button>

</header>

<section class="hero">

<h1>
بيع واشتري بسهولة
</h1>

<p>
أحدث الإعلانات المحلية
</p>

</section>

<section class="categories">

<div class="cat">🚗 سيارات</div>

<div class="cat">🏠 عقارات</div>

<div class="cat">📱 جوالات</div>

<div class="cat">💻 إلكترونيات</div>

<div class="cat">🪑 أثاث</div>

<div class="cat">👕 ألبسة</div>

</section>

<section class="grid">

<div class="card">

<img src="https://picsum.photos/700/500?1">

<div class="info">

<h2>
توكسان 2020
</h2>

<div class="price">
18,500 $
</div>

<div class="phone">
📞 099999999
</div>

</div>

</div>

<div class="card">

<img src="https://picsum.photos/700/500?2">

<div class="info">

<h2>
شقة للبيع
</h2>

<div class="price">
25,000 $
</div>

<div class="phone">
📞 098888888
</div>

</div>

</div>

<div class="card">

<img src="https://picsum.photos/700/500?3">

<div class="info">

<h2>
آيفون 15
</h2>

<div class="price">
850 $
</div>

<div class="phone">
📞 096666666
</div>

</div>

</div>

</section>

<footer>

© 2026 سوق دير الزور

</footer>

</body>
</html>
