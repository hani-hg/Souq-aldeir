<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق دير الزور المفتوح</title>
    <link rel="stylesheet" href="/CSS/style.css">
</head>
<body>
    <header>
        <h1>🛒 سوق دير الزور المفتوح</h1>
    </header>

    <main id="app"></main>

    <!-- تحميل مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"></script>

    <!-- ملفات المشروع بمسارات مطلقة -->
    <script src="/js/firebase.js"></script>
    <script src="/js/ads.js"></script>
    <script src="/js/app.js"></script>

    <!-- كشف بسيط للتأكد من تحميل الملفات -->
    <script>
        window.onload = function() {
            if (typeof firebase === 'undefined') {
                alert('❌ فشل تحميل Firebase');
            } else {
                console.log('✅ Firebase loaded');
            }
            if (typeof window.addAd === 'undefined') {
                alert('❌ فشل تحميل ads.js');
            } else {
                console.log('✅ ads.js loaded');
            }
        };
    </script>
</body>
</html>
