<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المدير - سوق دير الزور</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="src/css/style.css">
</head>
<body>

<!-- TOP NAV -->
<div class="topnav">
  <div class="logo-wrap">
    <div class="logo-icon">🛡️</div>
    <div class="logo-text">لوحة المدير<small>سوق دير الزور</small></div>
  </div>
  <div class="nav-btns">
    <a href="index.html" class="nav-btn" title="رجوع للسوق"><i class="fa fa-arrow-right"></i></a>
  </div>
</div>

<!-- GUARD (shown until we confirm the signed-in user is an admin) -->
<div id="guardArea" class="admin-guard">
  <div>
    <i class="fa fa-spinner fa-spin" style="font-size:2em"></i>
    <p style="margin-top:10px">جاري التحقق من صلاحياتك...</p>
  </div>
</div>

<!-- MODAL: ADMIN PANEL (same sheet UI as index.html, opened automatically below) -->
<div class="modal" id="adminModal">
  <div class="sheet">
    <div class="handle"></div>
    <div class="sheet-head">
      <span class="sheet-title">🛡️ لوحة المدير</span>
      <a href="index.html" class="x-btn">✕</a>
    </div>
    <div id="adminContent"></div>
  </div>
</div>

<!-- MODAL: AD DETAIL (so the admin can inspect an ad from the moderation list) -->
<div class="modal" id="detailModal">
  <div class="sheet">
    <div class="handle"></div>
    <div class="sheet-head">
      <span class="sheet-title">تفاصيل الإعلان</span>
      <button class="x-btn" onclick="closeModal('detailModal')">✕</button>
    </div>
    <div id="detailContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase SDK v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<!-- App scripts (only what the admin panel needs) -->
<script src="src/js/firebase.js"></script>
<script src="src/js/utils.js"></script>
<script src="src/components/toast.js"></script>
<script src="src/components/modal.js"></script>
<script src="src/js/ads.js"></script>
<script src="src/js/admin.js"></script>

<script>
  initModals();

  auth.onAuthStateChanged(async (u) => {
    const guard = document.getElementById('guardArea');
    if (!u) {
      guard.innerHTML = '<div><i class="fa fa-lock" style="font-size:2em"></i>' +
        '<p style="margin-top:10px">سجّل دخولك من الصفحة الرئيسية أولاً، ثم عد لهذه الصفحة.</p>' +
        '<a href="index.html" class="btn btn-blue" style="margin-top:14px;display:inline-flex;width:auto;padding:10px 22px">الذهاب لتسجيل الدخول</a></div>';
      return;
    }
    currentUser = u;
    const doc = await db.collection('users').doc(u.uid).get().catch(() => null);
    isAdmin = doc && doc.exists && doc.data().role === 'admin';
    if (!isAdmin) {
      guard.innerHTML = '<div><i class="fa fa-ban" style="font-size:2em"></i>' +
        '<p style="margin-top:10px">هذا الحساب لا يملك صلاحية الوصول للوحة المدير.</p>' +
        '<a href="index.html" class="btn btn-outline" style="margin-top:14px;display:inline-flex;width:auto;padding:10px 22px">رجوع للسوق</a></div>';
      return;
    }
    guard.style.display = 'none';
    // Load ads (admin.js reads the shared `allAds` array) then open the panel.
    db.collection('ads').orderBy('createdAt', 'desc').get().then(snap => {
      allAds = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      openAdminPanel();
    });
  });
</script>
</body>
</html>
